<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장학생 관리</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#3b3a6b">
<style>
:root{--ink:#1f2433;--muted:#5d6475;--line:#dfe2ea;--bg:#f5f6f9;--card:#fff;--accent:#4b4a8c;--accent-soft:#ecebf7;--side:#2f2e5a;--side-txt:#eceaf8;--side-muted:#b4b1d6;--side-line:#45437a;--danger:#b42318;--ok:#1a7f4b;--warn:#b54708}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.app{display:flex;min-height:100vh}
nav.side{width:226px;background:var(--side);color:var(--side-txt);flex-shrink:0;padding:10px 0;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:8px 16px 14px;font-weight:700;font-size:15px;border-bottom:1px solid var(--side-line);margin-bottom:6px;display:flex;align-items:center;gap:10px}
.brand .lg{width:42px;height:42px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}.brand .lg img{width:34px;height:34px}
.brand small{display:block;font-weight:400;color:var(--side-muted);font-size:12px}
nav.side a{display:flex;align-items:center;gap:10px;margin:1px 10px;padding:0 12px;min-height:40px;border-radius:8px;color:var(--side-txt);text-decoration:none;cursor:pointer}
nav.side a:hover{background:rgba(255,255,255,.08)}nav.side a.active{background:var(--accent);color:#fff;font-weight:600}
.yearsel{padding:10px 18px}.yearsel label{font-size:12px;color:var(--side-muted);display:block;margin-bottom:3px}.yearsel select{width:100%;color:#1f2433}
nav.side .foot{padding:12px 18px;border-top:1px solid var(--side-line);margin-top:10px;font-size:12px;color:var(--side-muted)}
nav.side .foot button{width:100%;margin-top:6px;background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.22)}
main{flex:1;padding:20px 26px;min-width:0;max-width:1200px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px}.hd .hp{display:flex;gap:6px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:3px;min-width:150px}.field label{font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #c7cbd6;border-radius:6px;background:#fff;color:inherit}
textarea{min-height:70px;width:100%;resize:vertical}
button,.btn{font:inherit;padding:7px 12px;border-radius:6px;border:1px solid #c7cbd6;background:#fff;cursor:pointer;color:inherit;display:inline-flex;align-items:center;gap:5px;text-decoration:none}
button:hover,.btn:hover{border-color:#98a0b3}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--danger);border-color:#f0b4ae}button.small,.btn.small{padding:3px 9px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
table.data{width:100%;border-collapse:collapse;background:#fff}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
table.data th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc;white-space:nowrap}
table.data tbody tr.click{cursor:pointer}table.data tbody tr.click:hover td{background:#f7f7fc}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}.stat:hover{border-color:#a9a6d6}
.stat .v{font-size:22px;font-weight:700}.stat .l{font-size:12px;color:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;background:#eef0f4;margin:1px 2px 1px 0;white-space:nowrap}
.tag.ok{background:#e3f4ea;color:var(--ok)}.tag.warn{background:#fdf0e1;color:var(--warn)}.tag.bad{background:#fde8e6;color:var(--danger)}.tag.vi{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:12px}
.banner{padding:10px 12px;border-radius:8px;margin-bottom:12px;background:#fff7e6;border:1px solid #f5d9a8}
.banner.info{background:#eef2ff;border-color:#c7d0f5}
.thumb{width:38px;height:46px;border-radius:5px;object-fit:cover;background:#e9ebf1;display:block}
.ph{background:#e9ebf1;display:flex;align-items:center;justify-content:center;color:#9aa1b2;font-size:11px;text-align:center}
.detail{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
.bigphoto{width:220px;height:270px;border-radius:10px;object-fit:cover;background:#e9ebf1;display:block}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px}.kv .k{color:var(--muted);font-size:13px}
.yr{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.yr.cur{border-color:#a9a6d6;background:#fbfbff}
.yr h3{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 10px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:12px;padding:18px 20px;width:min(720px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h3{margin:0 0 12px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px}.form-grid .full{grid-column:1/-1}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;right:18px;background:#1f2433;color:#fff;padding:10px 14px;border-radius:8px;z-index:60}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 12px;max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.chk label{display:flex;gap:6px;align-items:center;padding:3px 4px;border-radius:5px;cursor:pointer}.chk label:hover{background:#f4f4fa}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.kid{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;background:#fff}.kid:hover{border-color:#a9a6d6}
.kid img,.kid .ph{width:48px;height:58px;border-radius:6px;object-fit:cover;flex:none}
.cards-pv{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px}
.pv-wrap{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.pv-wrap .tc{transform-origin:top left}
#print{display:none}
/* ---------- 출력물 / 카드: 흑백 ---------- */
.pg{color:#000;background:#fff;font-size:12.5px;line-height:1.45}
.pg table{border-collapse:collapse;width:100%}.pg th,.pg td{border:1px solid #000;padding:5px 7px;text-align:left;vertical-align:top}
.pg th{font-weight:bold;width:32mm}
.sheet-hd{display:flex;gap:7mm;align-items:flex-start;margin-bottom:6mm}
.sheet-hd .pimg{width:35mm;height:45mm;object-fit:cover;border:1px solid #000;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px}
.sheet-title{font-size:18px;font-weight:bold;margin:0 0 3mm}
.sheet-sub{font-size:12px;margin-bottom:2mm}
.tc{width:180mm;height:122mm;border:1.2px solid #000;padding:7mm 8mm;display:flex;flex-direction:column;background:#fff;color:#000;font-size:13.5px;line-height:1.5;overflow:hidden}
.tc .t1{font-size:18px;font-weight:bold;text-align:center;margin-bottom:1mm}
.tc .t2{text-align:center;font-size:12px;margin-bottom:4mm;border-bottom:1px solid #000;padding-bottom:3mm}
.tc .body{display:flex;gap:7mm;flex:1;min-height:0}
.tc .pimg{width:52mm;height:66mm;object-fit:cover;border:1px solid #000;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px}
.tc .nm{font-size:20px;font-weight:bold;margin-bottom:2mm}
.tc .ln{margin-bottom:1.6mm}.tc .ln b{display:inline-block;min-width:21mm}
.tc .pr{margin-top:1mm}
.tc .ft{text-align:right;font-size:12px;margin-top:3mm}
.fiche{height:127mm;padding:4mm 6mm;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#000;display:flex;flex-direction:column}
.fiche .ti{text-align:center;font-weight:bold;font-size:17px}.fiche .an{text-align:center;font-size:12px;margin-bottom:3mm;border-bottom:1.5px solid #000;padding-bottom:3mm}
.fiche .l{margin:2.2mm 0;display:flex;gap:2mm;align-items:baseline}.fiche .l .d{flex:1;border-bottom:1px dotted #000;min-height:5mm}
.fiche .dl{border-bottom:1px dotted #000;height:7mm}
.cut{text-align:left;font-size:10px;border-top:1px dashed #000;margin:2mm 0;padding-top:1mm}
@media (max-width:820px){.app{flex-direction:column}nav.side{width:auto;height:auto;position:static;display:flex;flex-wrap:wrap;padding:6px;align-items:center}.brand{width:100%;border:0;margin:0;padding:6px 10px}nav.side a{padding:4px 10px;min-height:34px}.yearsel{padding:4px 10px}.yearsel label{display:none}nav.side .foot{display:none}main{padding:12px}.detail{grid-template-columns:1fr}.bigphoto{width:160px;height:200px}.cards-pv{grid-template-columns:1fr}.hide-m{display:none}}
@media print{
 body{background:#fff}
 .app,.modal-bg,.toast{display:none!important}
 #print{display:block}
 @page{size:A4;margin:12mm}
 #print .pgb{page-break-after:always;break-after:page}
 #print .pgb:last-child{page-break-after:auto;break-after:auto}
 .tc{margin:0 auto 6mm}
}
</style>
</head>
<body>
<div class="app">
 <nav class="side" id="nav"></nav>
 <main id="main"></main>
</div>
<div id="print"></div>
<script>
'use strict';
/* =========================================================
   장학생 관리 — 데이터는 OneDrive 폴더의 bourses_donnees.json
   사진: photos/  카드 스캔: fiches/  자동 백업: sauvegardes/
   ========================================================= */
const APP_VERSION='2 (2026-11-20)';
const DATAFILE='bourses_donnees.json';
const KEY='bourses_db_v1';
const ST_E=['장학중','중단','졸업'];
const ST_D=['후원중','중단'];
let DB=null,DIR=null,DSTATE='none',DERR='',LASTMOD=0,DIRTY=false;
const UI={view:'eleves',id:null,annee:null,f:{st:'장학중',ec:'',don:'',q:''},cd:{don:'',ids:null}};

/* ---------- 도구 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jsq=s=>String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const today=()=>new Date().toISOString().slice(0,10);
function fmtD(d){if(!d)return '';const [y,m,j]=d.split('-');return `${y}.${m}.${j}`}
function fmtFR(d){if(!d)return '';const [y,m,j]=d.split('-');return `${j}/${m}/${y}`}
function age(d){if(!d)return '';const b=new Date(d),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function download(name,data,type){const b=data instanceof Blob?data:new Blob([data],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
const cmpNom=(a,b)=>a.nom.localeCompare(b.nom,'fr');
const NIV={CP1:'초등 1학년',CP2:'초등 2학년',CE1:'초등 3학년',CE2:'초등 4학년',CM1:'초등 5학년',CM2:'초등 6학년','6ème':'중학교 1학년','5ème':'중학교 2학년','4ème':'중학교 3학년','3ème':'중학교 4학년','2nde':'고등학교 1학년','1ère':'고등학교 2학년','Tle':'고등학교 3학년',PS:'유치원(소)',MS:'유치원(중)',GS:'유치원(대)'};
function nivKo(c){if(!c)return '';const k=Object.keys(NIV).find(k=>k.toLowerCase()===String(c).trim().toLowerCase());return k?NIV[k]:''}

/* ---------- 데이터 접근 ---------- */
const A=()=>UI.annee||DB.settings.annee;
const elv=id=>DB.eleves.find(e=>e.id===id);
const don=id=>DB.donateurs.find(d=>d.id===id);
const stE=(e,a=A())=>e.statut?.[a]||'';
const stD=(d,a=A())=>d.statut?.[a]||'';
const yr=(e,a=A())=>e.annees?.[a]||{};
function lastYr(e,key){const ys=Object.keys(e.annees||{}).sort().reverse();for(const y of ys)if(e.annees[y][key])return {a:y,v:e.annees[y][key]};return null}
const donsOf=(eid,a=A())=>DB.matches.filter(m=>m.annee===a&&m.eleve===eid).map(m=>don(m.donateur)).filter(Boolean);
const kidsOf=(did,a=A())=>DB.matches.filter(m=>m.annee===a&&m.donateur===did).map(m=>elv(m.eleve)).filter(Boolean).sort(cmpNom);
const annees=()=>{const s=new Set(DB.settings.annees||[]);DB.eleves.forEach(e=>Object.keys(e.statut||{}).forEach(a=>s.add(a)));return [...s].sort()};
function nextId(arr,p){let n=0;arr.forEach(x=>{const k=parseInt(String(x.id).slice(1),10);if(k>n)n=k});return p+String(n+1).padStart(3,'0')}
function logJ(msg){DB.journal=DB.journal||[];DB.journal.push({at:new Date().toISOString(),msg});if(DB.journal.length>800)DB.journal=DB.journal.slice(-800)}
function emptyDB(){const y=new Date();const a=y.getMonth()>=7?y.getFullYear():y.getFullYear()-1;const an=`${a}-${String(a+1).slice(2)}`;return {meta:{app:'bourses',format:1,rev:0,at:new Date().toISOString()},settings:{annee:an,annees:[an],ecoles:[],lastBackup:null},eleves:[],donateurs:[],matches:[],journal:[]}}
function migrate(d){d.settings=d.settings||{};d.settings.annees=d.settings.annees||[d.settings.annee];d.settings.ecoles=d.settings.ecoles||[];d.eleves=d.eleves||[];d.donateurs=d.donateurs||[];d.matches=d.matches||[];d.journal=d.journal||[];d.meta=d.meta||{rev:0};d.eleves.forEach(e=>{e.statut=e.statut||{};e.annees=e.annees||{}});d.donateurs.forEach(x=>x.statut=x.statut||{});d.settings.cardTitle=d.settings.cardTitle??'후원해 주셔서 감사합니다';d.settings.cardFooter=d.settings.cardFooter??'부르키나파소 보보디울라소에서';return d}

/* ---------- 저장: 브라우저 + OneDrive 폴더 ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('bourses_fichier',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){const d=await idb();return new Promise(r=>{const q=d.transaction('h').objectStore('h').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}
async function idbSet(k,v){const d=await idb();return new Promise(r=>{const t=d.transaction('h','readwrite');t.objectStore('h').put(v,k);t.oncomplete=()=>r()})}
const DIR_OK=typeof window.showDirectoryPicker==='function';
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
async function fh(){return DIR.getFileHandle(DATAFILE,{create:true})}
async function readData(){const f=await (await fh()).getFile();LASTMOD=f.lastModified;const t=await f.text();if(!t.trim())return null;return migrate(JSON.parse(t))}
let saveT=null;
function save(msg){if(msg)logJ(msg);DB.meta.rev=(DB.meta.rev||0)+1;DB.meta.at=new Date().toISOString();DIRTY=true;saveLocal();clearTimeout(saveT);saveT=setTimeout(writeData,250);renderNavFoot()}
async function writeData(){
 if(!DIR||DSTATE!=='ok')return;
 try{
  const h=await fh();const f=await h.getFile();
  if(LASTMOD&&f.lastModified!==LASTMOD){
   const t=await f.text();let other=null;try{other=JSON.parse(t)}catch(e){}
   if(other&&(other.meta?.rev||0)>=(DB.meta.rev||0)){
    await saveSub('sauvegardes',`충돌_이쪽내용_${today()}_${Date.now()}.json`,JSON.stringify(DB));
    DB=migrate(other);LASTMOD=f.lastModified;DIRTY=false;saveLocal();render();
    alert('다른 컴퓨터에서 자료 파일이 먼저 바뀌어 그 내용을 불러왔습니다.\n방금 이 화면에서 고친 내용은 sauvegardes 폴더에 "충돌_…" 파일로 따로 보관했습니다. 필요하면 다시 입력해 주세요.');return}
  }
  const w=await h.createWritable();await w.write(JSON.stringify(DB));await w.close();
  LASTMOD=(await h.getFile()).lastModified;DIRTY=false;renderNavFoot();autoBackup();
 }catch(e){DSTATE='error';DERR=e.message;renderNavFoot()}
}
async function saveSub(dir,name,data){const d=await DIR.getDirectoryHandle(dir,{create:true});const h=await d.getFileHandle(name,{create:true});const w=await h.createWritable();await w.write(data);await w.close()}
async function autoBackup(force){
 if(!DIR||DSTATE!=='ok')return;const lb=DB.settings.lastBackup;
 if(!force&&lb&&(Date.now()-new Date(lb).getTime())<6.5*864e5)return;
 try{const name=`bourses_sauvegarde_${today()}.json`;DB.settings.lastBackup=new Date().toISOString();await saveSub('sauvegardes',name,JSON.stringify(DB));
  const d=await DIR.getDirectoryHandle('sauvegardes');const ns=[];for await(const [n,h] of d.entries())if(/^bourses_sauvegarde_\d{4}-\d{2}-\d{2}\.json$/.test(n))ns.push(n);
  ns.sort();while(ns.length>30){const n=ns.shift();try{await d.removeEntry(n)}catch(e){}}
  saveLocal();const w=await (await fh()).createWritable();await w.write(JSON.stringify(DB));await w.close();LASTMOD=(await (await fh()).getFile()).lastModified;
  if(force)toast('백업 저장: sauvegardes/'+name)}catch(e){}
}
async function useDir(h,mode){
 DIR=h;await idbSet('dir',h);DSTATE='ok';
 const fileDB=await readData();
 if(fileDB){
  if(DB&&mode!=='open'&&(DB.meta.rev||0)>(fileDB.meta.rev||0)){LASTMOD=0;await writeData()}
  else{DB=fileDB;DIRTY=false;saveLocal()}
 }else{
  if(!DB||mode==='new'){DB=DB||emptyDB()}
  await writeData();
 }
 PHOTO={};render();
}
async function pickDir(){
 if(!DIR_OK){alert('이 브라우저에서는 폴더 연결이 안 됩니다. 맥북의 크롬(Chrome)에서 열어 주세요.');return}
 try{const h=await window.showDirectoryPicker({id:'bourses-dir',mode:'readwrite'});
  let has=false;try{await h.getFileHandle(DATAFILE);has=true}catch(e){}
  if(!has&&!confirm(`이 폴더에는 자료 파일(${DATAFILE})이 없습니다.\n이 폴더에 새 자료 파일을 만들까요?`+(DB&&DB.eleves.length?`\n(지금 화면의 자료 ${DB.eleves.length}명이 저장됩니다)`:'')))return;
  await useDir(h,has?'open':'new');toast('폴더 연결됨: '+h.name)}catch(e){if(e.name!=='AbortError')alert(e.message)}
}
async function resumeDir(){try{const h=DIR||await idbGet('dir');if(!h)return pickDir();const p=await h.requestPermission({mode:'readwrite'});if(p!=='granted')return;await useDir(h,'resume')}catch(e){DSTATE='error';DERR=e.message;render()}}
async function checkExternal(){if(!DIR||DSTATE!=='ok'||DIRTY)return;try{const f=await (await fh()).getFile();if(f.lastModified===LASTMOD)return;const d=await readData();if(d){DB=d;saveLocal();render();toast('다른 곳에서 바뀐 내용을 불러왔습니다')}}catch(e){}}
window.addEventListener('focus',checkExternal);
window.addEventListener('beforeunload',e=>{if(DIRTY&&DSTATE==='ok'){writeData();e.preventDefault();e.returnValue=''}});

/* ---------- 사진·스캔 파일 ---------- */
let PHOTO={};
async function fileURL(dir,name){if(!name||!DIR||DSTATE!=='ok')return null;const k=dir+'/'+name;if(PHOTO[k])return PHOTO[k];try{const d=await DIR.getDirectoryHandle(dir);const f=await (await d.getFileHandle(name)).getFile();return PHOTO[k]=URL.createObjectURL(f)}catch(e){return null}}
function photoName(e,a){if(a){const y=yr(e,a);if(y.photo)return y.photo}const l=lastYr(e,'photo');return l?l.v:null}
async function photoURL(e,a){return fileURL('photos',photoName(e,a))}
async function fillPhotos(root=document){
 const imgs=[...root.querySelectorAll('img[data-eid]')];
 await Promise.all(imgs.map(async im=>{const e=elv(im.dataset.eid);const u=e&&await photoURL(e,im.dataset.yr||null);if(u){im.src=u;im.style.visibility='visible'}else{im.replaceWith(Object.assign(document.createElement('div'),{className:im.className+' ph',textContent:'사진 없음'}))}}));
}
const imgTag=(e,cls,a)=>`<img class="${cls}" data-eid="${e.id}" ${a?`data-yr="${a}"`:''} alt="" style="visibility:hidden">`;
function resizeImg(file,max=900){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>b?res(b):rej(new Error('이미지 변환 실패')),'image/jpeg',.86)};img.onerror=()=>rej(new Error('사진 파일을 읽을 수 없습니다'));img.src=URL.createObjectURL(file)})}
function needDir(){if(DIR&&DSTATE==='ok')return true;alert('사진과 스캔 파일을 저장하려면 먼저 OneDrive 폴더를 연결해 주세요 (왼쪽 아래 버튼).');return false}
async function uploadPhoto(eid,a,file){if(!file||!needDir())return;try{const e=elv(eid);const b=await resizeImg(file);const name=`${eid}_${a}.jpg`;await saveSub('photos',name,b);e.annees[a]=e.annees[a]||{};e.annees[a].photo=name;delete PHOTO['photos/'+name];save(`사진 등록: ${e.nom} (${a})`);render();toast('사진 저장됨')}catch(x){alert(x.message)}}
async function uploadFiche(eid,a,file){if(!file||!needDir())return;try{const e=elv(eid);const ext=(file.name.split('.').pop()||'pdf').toLowerCase();const name=`${eid}_${a}.${ext}`;await saveSub('fiches',name,file);e.annees[a]=e.annees[a]||{};e.annees[a].fiche=name;delete PHOTO['fiches/'+name];save(`카드 스캔 등록: ${e.nom} (${a})`);render();toast('스캔 파일 저장됨')}catch(x){alert(x.message)}}
async function openFiche(eid,a){const e=elv(eid);const n=yr(e,a).fiche;const u=await fileURL('fiches',n);if(u)window.open(u,'_blank');else alert('파일을 열 수 없습니다. 폴더 연결을 확인해 주세요.')}

/* ---------- 화면 틀 ---------- */
function go(v,id){UI.view=v;UI.id=id??null;render();window.scrollTo(0,0)}
function syncLabel(){if(!DIR_OK)return '이 브라우저: 폴더 연결 불가 (보기 전용)';if(DSTATE==='ok')return (DIRTY?'저장 중…':'✓ 저장됨')+' — 폴더 '+DIR.name;if(DSTATE==='need')return '폴더 다시 연결 필요';if(DSTATE==='error')return '저장 오류: '+DERR;return '폴더 연결 안 됨'}

function hd(t,btns=''){return `<div class="hd"><h1>${t}</h1><div class="hp">${btns}</div></div>`}

/* ---------- 장학생 목록 ---------- */
function elevesFiltered(){
 const f=UI.f,q=f.q.trim().toLowerCase();
 return DB.eleves.filter(e=>{
  const s=stE(e);
  if(f.st==='장학중'&&s!=='장학중')return false;
  if(f.st==='기타'&&s==='장학중')return false;
  if(f.ec&&e.ecole!==f.ec)return false;
  if(f.don==='none'&&donsOf(e.id).length)return false;
  if(f.don==='nophoto'&&photoName(e))return false;
  if(f.don==='nocard'&&(yr(e).projet||yr(e).priere))return false;
  if(q&&!(e.nom+' '+e.pere+' '+e.mere+' '+e.tel).toLowerCase().includes(q))return false;
  return true}).sort(cmpNom);
}
function setF(k,v){UI.f[k]=v;render()}
function vEleves(){
 const act=DB.eleves.filter(e=>stE(e)==='장학중');
 const noDon=act.filter(e=>!donsOf(e.id).length).length,noPh=act.filter(e=>!photoName(e)).length,noCard=act.filter(e=>!(yr(e).projet||yr(e).priere)).length;
 const L=elevesFiltered();const ecs=[...new Set(DB.eleves.map(e=>e.ecole).filter(Boolean))].sort();
 const stat=(v,l,fn)=>`<div class="stat" onclick="${fn}"><div class="v">${v}</div><div class="l">${l}</div></div>`;
 return hd(`장학생 — ${A()}`,`<button class="primary" onclick="editEleve()">＋ 장학생 추가</button><button onclick="printFiches(elevesFiltered().map(e=>e.id))">🖨 학생 카드 양식 (${L.length}명)</button>`)+
 `<div class="stats">${stat(act.length,'장학중',"UI.f={st:'장학중',ec:'',don:'',q:''};render()")}${stat(noDon,'후원자 없는 학생',"UI.f.st='장학중';setF('don','none')")}${stat(noPh,'사진 없는 학생',"UI.f.st='장학중';setF('don','nophoto')")}${stat(noCard,'장래희망·기도제목 없음',"UI.f.st='장학중';setF('don','nocard')")}</div>
 <div class="card"><div class="row">
  <div class="field"><label>상태 (${A()})</label><select onchange="setF('st',this.value)">${[['장학중','장학중'],['기타','중단·졸업·기록 없음'],['','전체']].map(([v,l])=>`<option value="${v}" ${UI.f.st===v?'selected':''}>${l}</option>`).join('')}</select></div>
  <div class="field"><label>학교</label><select onchange="setF('ec',this.value)"><option value="">전체</option>${ecs.map(x=>`<option ${UI.f.ec===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
  <div class="field"><label>보기</label><select onchange="setF('don',this.value)">${[['','전체'],['none','후원자 없는 학생'],['nophoto','사진 없는 학생'],['nocard','장래희망·기도제목 없음']].map(([v,l])=>`<option value="${v}" ${UI.f.don===v?'selected':''}>${l}</option>`).join('')}</select></div>
  <div class="field" style="flex:1"><label>검색 (이름·보호자·전화)</label><input value="${esc(UI.f.q)}" oninput="UI.f.q=this.value;clearTimeout(window._qt);window._qt=setTimeout(()=>{render();const i=document.querySelector('main input[oninput]');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)"></div>
 </div></div>
 <div class="card" style="padding:0;overflow:auto"><table class="data"><thead><tr><th></th><th>이름</th><th class="hide-m">성별</th><th class="hide-m">생년월일</th><th>학교 · 학년</th><th>후원자</th><th>상태</th></tr></thead><tbody>
 ${L.map(e=>{const y=yr(e),s=stE(e);return `<tr class="click" onclick="go('eleve','${e.id}')"><td style="width:50px">${imgTag(e,'thumb')}</td><td><b>${esc(e.nom)}</b></td><td class="hide-m">${esc(e.sexe)}</td><td class="hide-m">${fmtD(e.naissance)}${e.naissance?` <span class="muted small">(${age(e.naissance)}세)</span>`:''}</td><td>${[esc(e.ecole),y.classe?`<b>${esc(y.classe)}</b>`:''].filter(Boolean).join(' · ')}</td><td>${donsOf(e.id).map(d=>`<span class="tag vi">${esc(d.nom)}</span>`).join('')||(s==='장학중'?'<span class="tag warn">없음</span>':'')}</td><td>${s?`<span class="tag ${s==='장학중'?'ok':s==='졸업'?'':'bad'}">${s}</span>`:'<span class="muted small">—</span>'}</td></tr>`}).join('')||'<tr><td colspan="7" class="muted" style="padding:20px">해당하는 학생이 없습니다</td></tr>'}
 </tbody></table></div>`;
}

 const a=A(),ds=donsOf(e.id),ys=[...new Set([...Object.keys(e.annees),...Object.keys(e.statut),a])].sort().reverse();
 return `<div class="hd"><div class="row" style="align-items:center"><button onclick="go('eleves')">← 목록</button><button ${prev?'':'disabled'} onclick="go('eleve','${prev?.id||''}')">◀ 이전</button><button ${next?'':'disabled'} onclick="go('eleve','${next?.id||''}')">다음 ▶</button>${i>=0?`<span class="muted small">${i+1} / ${L.length}</span>`:''}</div>

  <div class="kv">
   <div class="k">성별</div><div>${esc(e.sexe==='F'?'여 (F)':e.sexe==='M'?'남 (M)':'')}</div>
   <div class="k">생년월일</div><div>${fmtD(e.naissance)}${e.naissance?` (만 ${age(e.naissance)}세)`:''}</div>
   <div class="k">학교</div><div>${esc(e.ecole)}</div>
   <div class="k">아버지 / 보호자</div><div>${esc(e.pere)}</div>
   <div class="k">어머니 / 보호자</div><div>${esc(e.mere)}</div>
   <div class="k">연락처</div><div>${esc(e.tel)}</div>
   ${e.memo?`<div class="k">메모</div><div>${esc(e.memo)}</div>`:''}
   ${e.drive?`<div class="k">옛 구글 폴더</div><div><a href="${esc(e.drive)}" target="_blank" class="small">열기</a></div>`:''}
  </div></div>
  <div class="card"><h2>연결된 후원자 — ${a} <span class="muted small" style="font-weight:400">(출력물에는 나오지 않음)</span></h2>
   <div>${ds.map(d=>`<span class="tag vi" style="cursor:pointer;font-size:13px;padding:3px 10px" onclick="go('donateur','${d.id}')">${esc(d.nom)}</span>`).join(' ')||'<span class="muted">연결된 후원자가 없습니다</span>'}</div>
   <div style="margin-top:10px"><button class="small" onclick="editMatch('${e.id}')">후원자 연결 바꾸기</button></div></div>
  <h2>학년도별 기록</h2>
  ${ys.map(y=>{const r=e.annees[y]||{};const s=e.statut[y];const hist=DB.matches.filter(m=>m.annee===y&&m.eleve===e.id).map(m=>don(m.donateur)?.nom).filter(Boolean);return `<div class="yr ${y===a?'cur':''}"><h3><span>${y} ${s?`<span class="tag ${s==='장학중'?'ok':'bad'}">${s}</span>`:''} ${r.classe?`· ${esc(r.classe)} <span class="muted small" style="font-weight:400">${nivKo(r.classe)}</span>`:''}</span><span class="row" style="gap:6px">${r.fiche?`<button class="small" onclick="openFiche('${e.id}','${y}')">📄 카드 원본</button>`:''}<button class="small" onclick="editYear('${e.id}','${y}')">✏️ 수정</button></span></h3>

const fv=id=>document.getElementById(id)?.value.trim()??'';

 <div class="field"><label>생년월일</label><input id="f_nai" type="date" value="${esc(e.naissance)}"></div>
 <div class="field"><label>학교</label><input id="f_ec" list="ecs" value="${esc(e.ecole)}"><datalist id="ecs">${DB.settings.ecoles.map(x=>`<option>${esc(x)}</option>`).join('')}</datalist></div>

 <div class="field"><label>연락처</label><input id="f_tel" value="${esc(e.tel)}" placeholder="76880019 / 65011811"></div>

 <div class="field full"><label>메모</label><textarea id="f_memo">${esc(e.memo)}</textarea></div></div>

function saveEleve(id){
 const nom=fv('f_nom');if(!nom){alert('이름을 입력해 주세요');return}
 let e=id?elv(id):null;if(!e){e={id:nextId(DB.eleves,'B'),statut:{},annees:{}};DB.eleves.push(e)}
 Object.assign(e,{nom,sexe:fv('f_sexe'),naissance:fv('f_nai'),ecole:fv('f_ec'),pere:fv('f_pere'),mere:fv('f_mere'),tel:fv('f_tel'),memo:fv('f_memo')});
 document.querySelectorAll('[id^="f_st_"]').forEach(s=>{const y=s.id.slice(5);if(s.value)e.statut[y]=s.value;else delete e.statut[y]});
 if(e.ecole&&!DB.settings.ecoles.includes(e.ecole))DB.settings.ecoles.push(e.ecole);
 save((id?'학생 수정: ':'학생 추가: ')+nom);closeM();go('eleve',e.id);
}
function delEleve(id){const e=elv(id);if(!confirm(`${e.nom} 학생을 완전히 삭제할까요?\n(그만둔 학생은 삭제 대신 상태를 '중단'으로 바꾸는 것을 권합니다)`))return;DB.eleves=DB.eleves.filter(x=>x.id!==id);DB.matches=DB.matches.filter(m=>m.eleve!==id);save('학생 삭제: '+e.nom);closeM();go('eleves')}

function vReglages(){
 const a=DB.settings.annee,ys=annees(),n=+a.slice(0,4)+1,na=`${n}-${String(n+1).slice(2)}`;
 return hd('설정')+`<div class="card"><h2>저장 폴더</h2><p>${DSTATE==='ok'?`연결됨: <b>${esc(DIR.name)}</b> — 자료 파일 <b>${DATAFILE}</b>, 사진 <b>photos</b>, 카드 스캔 <b>fiches</b>, 카드 이미지 <b>cartes</b>, 자동 백업 <b>sauvegardes</b> (1주에 한 번, 최근 30개 보관)`:'연결되지 않음'}</p>
 <div class="row"><button onclick="pickDir()">📁 다른 폴더 선택</button>${DSTATE==='ok'?'<button onclick="autoBackup(true)">지금 백업</button>':''}<button onclick="download('bourses_sauvegarde_'+today()+'.json',JSON.stringify(DB),'application/json')">백업 파일 내려받기</button><label class="btn">백업에서 복원<input type="file" accept=".json" hidden onchange="restoreBackup(this.files[0])"></label></div></div>
 <div class="card"><h2>학년도</h2><p>기본 학년도: <b>${a}</b> &nbsp; <select onchange="DB.settings.annee=this.value;UI.annee=null;save('기본 학년도: '+this.value);render()">${ys.map(y=>`<option ${y===a?'selected':''}>${y}</option>`).join('')}</select></p>
 <p class="small muted">새 학년도가 시작되면 아래 버튼을 누르세요. ${a}에 '장학중'인 학생은 ${na}에도 '장학중'으로, '후원중'인 후원자는 '후원중'으로 이어집니다. 학년·장래희망·기도제목은 새로 입력합니다.</p>
 ${ys.includes(na)?`<p class="muted">${na} 학년도가 이미 있습니다.</p>`:`<label style="display:block;margin-bottom:8px"><input type="checkbox" id="rk" checked> 후원자 연결도 그대로 이어가기</label><button class="primary" onclick="newYear('${na}')">${na} 학년도 시작</button>`}</div>
 <div class="card"><h2>내보내기</h2><button onclick="exportCSV()">${A()} 장학생 목록 (엑셀용 CSV)</button></div>
 <div class="card"><h2>최근 변경 기록</h2><div class="small" style="max-height:260px;overflow:auto">${[...DB.journal].reverse().slice(0,80).map(j=>`<div>${fmtD(j.at.slice(0,10))} ${j.at.slice(11,16)} — ${esc(j.msg)}</div>`).join('')}</div></div>`;
}
function newYear(na){const a=DB.settings.annee,keep=$('#rk')?.checked;if(!confirm(`${na} 학년도를 시작할까요?`))return;
 download(`bourses_sauvegarde_avant_${na}_${today()}.json`,JSON.stringify(DB),'application/json');
 DB.eleves.forEach(e=>{if(e.statut[a]==='장학중')e.statut[na]='장학중'});DB.donateurs.forEach(d=>{if(d.statut[a]==='후원중')d.statut[na]='후원중'});
 if(keep)DB.matches.filter(m=>m.annee===a&&elv(m.eleve)?.statut[na]==='장학중').forEach(m=>DB.matches.push({annee:na,eleve:m.eleve,donateur:m.donateur}));
 DB.settings.annees=[...new Set([...DB.settings.annees,na])].sort();DB.settings.annee=na;UI.annee=null;save(`새 학년도 시작: ${na}`);render();toast(na+' 학년도 시작')}
function exportCSV(){const a=A();const rows=[['이름','성별','생년월일','학교','학년','장래희망','기도제목','아버지/보호자','어머니/보호자','연락처','상태','후원자']];DB.eleves.filter(e=>stE(e)).sort(cmpNom).forEach(e=>{const r=yr(e);rows.push([e.nom,e.sexe,e.naissance,e.ecole,r.classe||'',r.projet||'',r.priere||'',e.pere,e.mere,e.tel,stE(e),donsOf(e.id).map(d=>d.nom).join(', ')])});download(`장학생_${a}.csv`,'﻿'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\r\n'),'text/csv')}
function restoreBackup(file){if(!file)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(d.meta?.app!=='bourses')throw 0;if(DB&&!confirm(`이 백업(학생 ${d.eleves.length}명)으로 지금 자료를 바꿀까요?`))return;const old=DB?.meta?.rev||0;DB=migrate(d);DB.meta.rev=Math.max(old,DB.meta.rev||0);save('백업에서 복원');render();toast('복원했습니다')}catch(e){alert('장학생 관리 백업 파일이 아닙니다.')}};r.readAsText(file)}

/* ---------- 시작 ---------- */
(async()=>{
 try{const t=localStorage.getItem(KEY);if(t)DB=migrate(JSON.parse(t))}catch(e){}
 if(DIR_OK){try{const h=await idbGet('dir');if(h){DIR=h;const p=await h.queryPermission({mode:'readwrite'});if(p==='granted'){await useDir(h,'resume');}else DSTATE='need'}}catch(e){DSTATE='error';DERR=e.message}}
 if(DB&&!UI.annee)UI.annee=null;
 render();
 if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});navigator.serviceWorker.addEventListener('message',m=>{if(m.data==='bourses-update'&&confirm('새 버전이 있습니다. 지금 새로고침할까요?'))location.reload()})}
})();
</script>
</body>
</html>
