<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAenJC — Gestion scolaire</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f2a37">
<style>
:root{--ink:#1c2a20;--muted:#5b6b5f;--line:#dce3dc;--bg:#f5f7f4;--card:#fff;--accent:#2e7d3e;--accent-soft:#e6f1e8;--side:#1e4d2b;--side-txt:#e7f0e9;--side-muted:#a9c4af;--side-line:#2f6a3c;--danger:#b42318;--ok:#1a7f4b;--warn:#b54708}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.app{display:flex;min-height:100vh}
nav.side{width:236px;background:var(--side);color:var(--side-txt);flex-shrink:0;padding:10px 0;position:sticky;top:0;height:100vh;overflow:auto}
nav.side .brand{padding:8px 16px 14px;font-weight:700;font-size:15px;border-bottom:1px solid var(--side-line);margin-bottom:4px;display:flex;align-items:center;gap:11px}.side .brand .lg{width:48px;height:48px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}.side .brand .lg img{width:40px;height:40px;object-fit:contain}.side .grp{padding:14px 20px 4px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);display:flex;align-items:center;gap:6px}.side svg{flex:none}
nav.side .brand small{display:block;font-weight:400;color:var(--side-muted);font-size:12px}
nav.side a{display:flex;align-items:center;gap:11px;margin:1px 10px;padding:0 12px;min-height:40px;border-radius:8px;color:var(--side-txt);text-decoration:none;cursor:pointer;font-size:14px}
nav.side a:hover{background:rgba(255,255,255,.08);color:#fff}.side a.active{background:var(--accent);color:#fff;font-weight:600}
nav.side .foot{padding:14px 18px;border-top:1px solid var(--side-line);margin-top:12px;font-size:12px;color:var(--side-muted)}
nav.side .foot button{width:100%;margin-bottom:6px;background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.22)}
main{flex:1;padding:20px 26px;min-width:0}
h1{font-size:20px;margin:0 0 14px}
h2{font-size:16px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:3px;min-width:140px}
.field label{font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #c5cbd3;border-radius:5px;background:#fff;color:inherit}
input.err{border-color:var(--danger);background:#fff5f5}
textarea{min-height:60px;width:100%}
button,.btn{font:inherit;padding:7px 12px;border-radius:5px;border:1px solid #c5cbd3;background:#fff;cursor:pointer;color:inherit;display:inline-block}
button:hover,.btn:hover{border-color:#98a2b3}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--danger);border-color:#f0b4ae}
button.small{padding:3px 8px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
table.data{width:100%;border-collapse:collapse;background:#fff}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
table.data a{color:inherit;text-decoration:none}table.data a:hover{text-decoration:underline}
table.data th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc}
table.data tbody tr:hover td{background:#f8fafc}
table.data tfoot td{font-weight:700;border-top:2px solid var(--line)}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat .v{font-size:22px;font-weight:700}
.stat .l{font-size:12px;color:var(--muted)}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:#eef1f4}
.tag.ok{background:#e3f4ea;color:var(--ok)}.tag.warn{background:#fdf0e1;color:var(--warn)}.tag.bad{background:#fde8e6;color:var(--danger)}
.muted{color:var(--muted)}
.banner{padding:9px 12px;border-radius:6px;margin-bottom:12px;background:#fff7e6;border:1px solid #f5d9a8}
.grid-notes{border-collapse:collapse;background:#fff}
.grid-notes th,.grid-notes td{border:1px solid var(--line);padding:4px 5px;text-align:center;font-size:13px}
.grid-notes th{background:#fafbfc;font-weight:600;font-size:12px;max-width:90px}
.grid-notes td.name{text-align:left;white-space:nowrap;font-weight:500}
.grid-notes input{width:54px;text-align:center;padding:4px}
.grid-notes select{padding:3px}
.bwrap{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:start}
.blist{padding:6px;max-height:78vh;overflow:auto;margin:0}
.bitem{padding:6px 8px;border-radius:5px;cursor:pointer;font-size:13px}
.bitem:hover{background:#f1f4f8}.bitem.on{background:var(--accent-soft);font-weight:600}
.recu-wrap{height:270mm;display:flex;flex-direction:column;font-size:13.5px}
.recu-half{flex:1 1 0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.recu-cut{height:6mm;line-height:6mm;text-align:center;font-size:10px;letter-spacing:1px;overflow:hidden;white-space:nowrap;flex:0 0 6mm}
.recu-box{flex:1;border:1.5px solid #000;padding:4mm 7mm 3mm;display:flex;flex-direction:column;justify-content:space-between;margin:2mm 1.5px}
.recu-box.dense{padding:3mm 6mm 2.5mm}
.pg .recu-box th,.pg .recu-box td{padding:3px 8px;font-size:13.5px}
.pg .recu-box.dense th,.pg .recu-box.dense td{padding:2px 7px;font-size:13px}
.pg .recu-box table.info td{padding:2px 0;border:none}
.pg .recu-box .sign{margin-top:0;padding-top:0}
.pg .recu-box .sign div{min-height:16mm}
.pg .recu-box.dense .sign div{min-height:9mm}
.pv .pg{background:#fff;border:1px solid var(--line);padding:12mm;margin:0 auto 14px;max-width:210mm;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.sheet{background:#fff;border:1px solid var(--line);padding:12mm;max-width:210mm;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 10px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:10px;padding:18px 20px;width:min(780px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h3{margin:0 0 12px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;right:18px;background:#1f2a37;color:#fff;padding:10px 14px;border-radius:6px;z-index:60}
.steps{margin:0;padding-left:20px}.steps li{margin:4px 0}
#print{display:none}
@media (max-width:820px){.app{flex-direction:column}nav.side{width:auto;height:auto;position:static;display:flex;flex-wrap:wrap;padding:6px}nav.side .brand{width:100%;border:0;margin:0;padding:6px 10px}nav.side a{padding:6px 10px}nav.side .foot{display:none}.side .grp{display:none}.side .brand .lg{width:34px;height:34px}.side .brand .lg img{width:28px;height:28px}main{padding:14px}.bwrap{grid-template-columns:1fr}}
@media print{
 body{background:#fff}
 .app,.modal-bg,.toast{display:none!important}
 #print{display:block}
 @page{size:A4;margin:12mm}
}
/* Documents imprimés : noir et blanc, sans fond de couleur */
.pg{color:#000;background:#fff;font-family:"Times New Roman",Times,serif;font-size:12.5px;line-height:1.35}
#print .pg{page-break-after:always;break-after:page}
#print .pg:last-child{page-break-after:auto;break-after:auto}
.pg table{border-collapse:collapse;width:100%}
.pg th,.pg td{border:1px solid #000;padding:4px 6px;text-align:left}
.pg th{font-weight:bold}
.pg .c{text-align:center}
.pg tr.sep2 th,.pg tr.sep2 td{border-top:4px double #000}.pg .r{text-align:right}
.pg .hdr{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
.pg .title{text-align:center;font-size:17px;font-weight:bold;margin:8px 0 10px;text-transform:uppercase;letter-spacing:.5px}
.pg table.info td{border:none;padding:2px 4px}
.pg .sign{display:flex;justify-content:space-between;margin-top:22px}
.pg .sign div{flex:1;text-align:center;min-height:60px}
.pg .small{font-size:11px}
.pg .small th,.pg .small td{padding:3px 4px}
</style>
</head>
<body>
<div class="app">
 <nav class="side" id="nav"></nav>
 <main id="main"></main>
</div>
<div id="print"></div>
<script>
'use strict';
/* =========================================================
   EAenJC — Gestion scolaire (registre, inscriptions, frais,
   notes, bulletins). Données enregistrées dans le navigateur
   + fichier de sauvegarde (.json) à télécharger.
   ========================================================= */
const KEY='eaenjc_gestion_scolaire_v1';
const TRIMS=['T1','T2','T3'];
const TLABEL={T1:'1ère composition',T2:'2ème composition',T3:'3ème composition',AN:'Année'};
const NIV_MAT=['PS','MS','GS'];
const NIV_PRI=['CP1','CP2','CE1','CE2','CM1','CM2'];
const NIV_ALL=[...NIV_MAT,...NIV_PRI];
const NEXT={PS:'MS',MS:'GS',GS:'CP1',CP1:'CP2',CP2:'CE1',CE1:'CE2',CE2:'CM1',CM1:'CM2',CM2:null};
const STATUTS=['Actif','Non revenu','Transféré','Abandon','Sorti (fin de cycle)','Exclu','Ancien élève'];
const DEF_RUB=[{k:'scolarite',l:'Scolarité'},{k:'ape',l:'APE',ext:true},{k:'gouter',l:'Goûter'},{k:'livres',l:'Livres'}];
const TRANCHES=['1ère tranche','2ème tranche','3ème tranche','4ème tranche','Solde'];
const DECISIONS=['Admis(e)','Redouble','Abandon','Transféré(e)','Exclu(e)'];
const MAT_SCALE=[['A','Acquis'],['EC','En cours'],['NA','Non acquis']];

/* ---------- utilitaires ---------- */
let _u=0;
function uid(){return Date.now().toString(36)+(_u++).toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fcfa(n){return Math.round(+n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' F'}
function fmtDate(d){if(!d)return '';const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d);return m?`${m[3]}/${m[2]}/${m[1]}`:d}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function nextYear(a){const [x,y]=a.split('-').map(Number);return `${x+1}-${y+1}`}
function guessYear(){const d=new Date(),y=d.getFullYear();return d.getMonth()>=7?`${y}-${y+1}`:`${y-1}-${y}`}
function norm(s){return String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()}
function round2(x){return Math.round(x*100)/100}
function fmtN(x){return x==null||x===''?'':String(round2(+x)).replace('.',',')}
function fmtN2(x){return x==null?'—':(+x).toFixed(2).replace('.',',')}
function mention(v){if(v==null)return '';return v>=9?'Excellent':v>=8?'Très bien':v>=7?'Bien':v>=6?'Assez bien':v>=5?'Passable':v>=4?'Insuffisant':'Faible'}
function opts(list,sel){return list.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${String(v)===String(sel??'')?' selected':''}>${esc(t)}</option>`}).join('')}
function F(label,id,val,type,extra){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type||'text'}" value="${esc(val??'')}" ${extra||''}></div>`}
function FS(label,id,optionsHtml,extra){return `<div class="field"><label for="${id}">${label}</label><select id="${id}" ${extra||''}>${optionsHtml}</select></div>`}
function fval(id){const el=document.getElementById(id);return el?(el.type==='checkbox'?el.checked:String(el.value).trim()):''}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function download(name,content,mime){const b=new Blob([content],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}

/* ---------- données ---------- */
function defaultMatieres(niv){
 const m=a=>a.map(([n,max])=>({id:uid(),nom:n,max:max??null}));
 if(niv==='CP1'||niv==='CP2')return m([['Dictée',10],['Ecriture',10],['Copie',10],['Lecture',10],['Calcul',10],['Langage',10],['Exercices sensoriels',10],['Dessin',10],['Récitation / Chant',10],['EMC',10]]);
 if(niv==='CE1'||niv==='CE2')return m([['Lecture',10],['Expression écrite ou Rédaction',10],['Ecriture',10],['Dictée',10],['Conjugaison',10],['Vocabulaire',10],['Grammaire',10],['Copie',10],['Histoire',10],['Orthographe',10],['Opérations',10],['Problème',10],['Sciences',10],['Géographie',10],['Dessin',10],['Récitation / Chant',10],['EMC',10],['Anglais',10]]);
 if(niv==='CM1'||niv==='CM2')return m([['Lecture',10],['Rédaction',10],['Présentation',10],['Dictée',10],['Etude de texte',20],['Opération',20],['Problème',20],['Observation',20],['Histoire-Géo',20],['Dessin',10],['Récitation / Chant',10],['EMC',10],...(niv==='CM2'?[['Sport',10]]:[]),['Anglais',10]]);
 return m([['Langage oral'],['Pré-lecture'],['Graphisme / Pré-écriture'],['Pré-mathématiques'],['Découverte du monde'],['Activités artistiques (dessin, chant)'],['Éducation physique'],['Vivre ensemble / Comportement']]);
}
function zeroFrais(){const f={};DEF_RUB.forEach(r=>f[r.k]=0);return f}
function defaultDB(){
 const classes=[];
 NIV_MAT.forEach(n=>classes.push({id:uid(),ecole:'maternelle',niveau:n,nom:n,enseignant:'',frais:Object.assign(zeroFrais(),{scolarite:30000,ape:1000,gouter:5000,livres:5000}),matieres:defaultMatieres(n)}));
 NIV_PRI.forEach(n=>classes.push({id:uid(),ecole:'primaire',niveau:n,nom:n,enseignant:'',frais:Object.assign(zeroFrais(),{scolarite:40000,ape:1000}),matieres:defaultMatieres(n)}));
 return {version:2,
  settings:{annee:guessYear(),seuil:5,ville:'Bobo-Dioulasso',lastBackup:null,rubriques:DEF_RUB.map(r=>({...r})),
   prefixes:{primaire:'P',maternelle:'M'},cptMat:{primaire:0,maternelle:0},cptRecu:{primaire:0,maternelle:0},
   piedRecu:'',
   ecoles:{primaire:{nom:'École Primaire Privée Évangélique',devise:'',arrete:'',adresse:'Bobo-Dioulasso',tel:'',directeur:'TRAORE Soumaïla Etienne'},
           maternelle:{nom:'École Maternelle Privée Évangélique',devise:'',arrete:'',adresse:'Bobo-Dioulasso',tel:'',directeur:''}}},
  classes,eleves:[],inscriptions:[],paiements:[],evals:{}};
}
function migrate(d){
 const def=defaultDB();
 (d.paiements||[]).forEach(p=>{if(p.mode==='Bourse')p.mode='Espèces'});
 d.settings=Object.assign({},def.settings,d.settings||{});
 d.settings.ecoles=Object.assign({},def.settings.ecoles,d.settings.ecoles||{});
 ['prefixes','cptMat','cptRecu'].forEach(k=>d.settings[k]=Object.assign({},def.settings[k],d.settings[k]||{}));
 if(!Array.isArray(d.settings.rubriques)||!d.settings.rubriques.length)d.settings.rubriques=DEF_RUB.map(r=>({...r}));
 if(!Array.isArray(d.classes))d.classes=def.classes;
 ['eleves','inscriptions','paiements'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});
 d.classes.forEach(c=>{if(!Array.isArray(c.matieres))c.matieres=[];if(!c.frais){c.frais=zeroFrais();c.frais.scolarite=(+c.fraisScolarite||0)+(+c.fraisInscription||0)}});
 d.inscriptions.forEach(i=>{if(!i.frais){i.frais=zeroFrais();i.frais.scolarite=(+i.fraisScolarite||0)+(+i.fraisInscription||0)}i.arriere=+i.arriere||0;i.remise=+i.remise||0});
 d.paiements.forEach(p=>{if(!p.parts)p.parts={scolarite:+p.montant||0}});
 d.evals=d.evals||{};
 if(!Array.isArray(d.depenses))d.depenses=[];
 if(!Array.isArray(d.settings.depCats)||!d.settings.depCats.length)d.settings.depCats=['Fournitures scolaires','Maintenance et Reparations','Restauration scolaire','Eau et Electricite','Materiel pedagogique','Transport','Communication','Autres'];
 d.settings.cptDep=d.settings.cptDep||{};
 if(!Array.isArray(d.fondsArr))d.fondsArr=[];
 if(!d.settings.dateFix1){/* inscriptions 2026-2027 importées de l'Excel avec la date d'entrée d'origine : date = 1er paiement de l'année */
  (d.inscriptions||[]).forEach(i=>{if(i.annee==='2026-2027'&&!i.arrOnly&&(i.date||'')<'2026-06-01'){const ps=(d.paiements||[]).filter(p=>p.inscriptionId===i.id&&p.date).map(p=>p.date).sort();i.dateOrig=i.date;i.date=ps[0]||'2026-09-01'}});
  d.settings.dateFix1=true;
 }
 if(!d.settings.matFix1){/* CM1-CM2 : matières notées sur 20 (coefficient 2), comme dans l'Excel des bulletins */
  const S20=['etude de texte','operation','operations','probleme','observation','histoire-geo'];const nz=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
  (d.classes||[]).forEach(c=>{if(c.ecole==='primaire'&&/^CM/.test(c.niveau||''))(c.matieres||[]).forEach(m=>{if(S20.includes(nz(m.nom))&&(+m.max||0)===10)m.max=20})});
  d.settings.matFix1=true;
 }
 if(!d.settings.entreeFix1){/* élèves nouveaux de l'année : date d'entrée à l'école = date d'inscription */
  const E={};(d.eleves||[]).forEach(e=>E[e.id]=e);
  (d.inscriptions||[]).forEach(i=>{const e=E[i.eleveId];if(e&&!e.dateEntree&&!i.arrOnly&&i.type==='Nouveau'&&i.date&&!(d.inscriptions||[]).some(x=>x.eleveId===i.eleveId&&x!==i&&!x.arrOnly&&x.annee<i.annee))e.dateEntree=i.date});
  d.settings.entreeFix1=true;
 }
 if(!d.settings.cptFix1){/* compteurs = derniers numéros réellement utilisés (l'Excel avait des lignes numérotées vides) */
  const mx={p:0,m:0};(d.paiements||[]).forEach(p=>{const r=/-(p|m)(\d+)$/.exec(p.recu||'');if(r)mx[r[1]]=Math.max(mx[r[1]],+r[2])});
  d.settings.cptRecu={primaire:mx.p,maternelle:mx.m};
  const pf=d.settings.prefixes||{primaire:'P',maternelle:'M'},mm={primaire:0,maternelle:0};
  (d.eleves||[]).forEach(e=>[e.matricule,e.matriculeMat].forEach(m=>{m=String(m||'');['primaire','maternelle'].forEach(ec=>{if(m.startsWith(pf[ec]))mm[ec]=Math.max(mm[ec],+m.slice(pf[ec].length)||0)})}));
  d.settings.cptMat=mm;d.settings.cptFix1=true;
 }
 d.settings.rubriques.forEach(r=>{if(r.k==='ape'&&r.ext===undefined)r.ext=true});
 if(d.settings.pin&&!d.settings.pinAdmin){d.settings.pinAdmin=d.settings.pin}delete d.settings.pin;
 return d;
}
let STORAGE_OK=true;
function load(){try{const s=localStorage.getItem(KEY);if(s)return migrate(JSON.parse(s))}catch(e){STORAGE_OK=false}return defaultDB()}
let DB=load();
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(DB));STORAGE_OK=true}catch(e){STORAGE_OK=false;toast("Attention : enregistrement impossible dans ce navigateur. Téléchargez une sauvegarde.")}}
const APP_VERSION='43 (19/11/2026)';
let TRY=false,TRY_REAL=null;
function save(){if(TRY)return;saveLocal();if(FH){SYNC.dirty=true;saveSync();clearTimeout(SYNC.timer);SYNC.timer=setTimeout(writeFile,700);renderSync()}}

/* ---------- Fichier de données partagé (OneDrive) ---------- */
const FS_OK=typeof window.showOpenFilePicker==='function';
let FH=null,FSTATE='none',FERR='',CONFLICT=null,LASTMOD=0;
let SYNC=(()=>{try{return JSON.parse(localStorage.getItem(KEY+'_sync'))||{}}catch(e){return {}}})();SYNC.timer=null;
function saveSync(){try{localStorage.setItem(KEY+'_sync',JSON.stringify({baseRev:SYNC.baseRev??null,dirty:!!SYNC.dirty,at:SYNC.at||null}))}catch(e){}}
function devName(){try{return localStorage.getItem(KEY+'_dev')||''}catch(e){return ''}}
function setDevName(v){try{localStorage.setItem(KEY+'_dev',v.trim())}catch(e){}}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('eaenjc_fichier',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction('h','readwrite');v===null?tx.objectStore('h').delete(k):tx.objectStore('h').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const r=d.transaction('h').objectStore('h').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function readFile(){const f=await FH.getFile();LASTMOD=f.lastModified;const t=await f.text();if(!t.trim())return null;return JSON.parse(t)}
async function writeFile(force){
 if(TRY)return;if(!FH||(FSTATE!=='ok'&&!force))return;clearTimeout(SYNC.timer);
 try{
  const cur=await readFile();const curRev=cur?.meta?.rev??0;
  if(!force&&cur&&SYNC.baseRev!=null&&curRev!==SYNC.baseRev){FSTATE='conflict';CONFLICT=cur.meta||{};renderSync();render();return}
  DB.meta={rev:curRev+1,at:new Date().toISOString(),by:devName()||'?'};
  const w=await FH.createWritable();await w.write(JSON.stringify(DB));await w.close();
  const f=await FH.getFile();LASTMOD=f.lastModified;
  SYNC.baseRev=DB.meta.rev;SYNC.dirty=false;SYNC.at=DB.meta.at;saveSync();saveLocal();FSTATE='ok';CONFLICT=null;renderSync();
 }catch(e){FSTATE='error';FERR=e.message||String(e);renderSync()}
}
async function openHandle(h,mode){ // mode: 'resume' | 'open' | 'create'
 if(TRY){alert("Terminez d'abord le mode essai.");return}
 FH=h;
 try{
  if(mode==='create'){SYNC.baseRev=null;await writeFile(true);if(FSTATE==='ok')toast('Fichier de données créé');await idbSet('fh',h);render();return}
  const cur=await readFile();
  if(!cur){SYNC.baseRev=null;await writeFile(true);await idbSet('fh',h);render();return}
  if(!Array.isArray(cur.eleves))throw new Error("Ce fichier n'est pas un fichier de données EAenJC.");
  const curRev=cur.meta?.rev??0;
  if(mode==='resume'&&SYNC.dirty&&SYNC.baseRev!=null&&curRev!==SYNC.baseRev){FSTATE='conflict';CONFLICT=cur.meta||{};await idbSet('fh',h);renderSync();render();return}
  if(mode==='resume'&&SYNC.dirty&&curRev===SYNC.baseRev){FSTATE='ok';await writeFile();await idbSet('fh',h);render();return}
  DB=migrate(cur);SYNC.baseRev=curRev;SYNC.dirty=false;SYNC.at=cur.meta?.at||null;saveSync();saveLocal();FSTATE='ok';await idbSet('fh',h);render();
  if(mode==='open')toast('Fichier de données ouvert');
 }catch(e){FSTATE='error';FERR=e.message||String(e);renderSync();render()}
}

 catch(e){/* fichier momentanément indisponible */}
}

function arrEntrees(d1,d2){return DB.paiements.filter(p=>!p.annule&&+(p.parts||{}).arriere>0&&(!d1||p.date>=d1)&&(!d2||p.date<=d2)).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.recu||'').localeCompare(b.recu||''))}

/* ---------- évaluations ---------- */
function ev(iid,T){DB.evals[iid]=DB.evals[iid]||{};DB.evals[iid][T]=DB.evals[iid][T]||{n:{},abs:'',appr:''};return DB.evals[iid][T]}
function evGet(iid,T){return (DB.evals[iid]&&DB.evals[iid][T])||{n:{},abs:'',appr:''}}
function has(v){return v!==undefined&&v!==null&&v!==''}
function scoreOf(iid,T,c){
 const e=evGet(iid,T);let tot=0,max=0,cnt=0;
 c.matieres.forEach(m=>{const v=e.n[m.id];if(has(v)&&!isNaN(v)){tot+=+v;max+=+m.max||0;cnt++}});
 return {tot:round2(tot),max,cnt,moy:max?round2(tot/max*10):null};
}
function rankInto(res){
 const arr=Object.values(res).filter(r=>r.moy!=null).sort((a,b)=>b.moy-a.moy);
 let rank=0,prev=null;arr.forEach((r,k)=>{if(r.moy!==prev){rank=k+1;prev=r.moy}r.rang=rank});
 const cnt={};arr.forEach(r=>cnt[r.rang]=(cnt[r.rang]||0)+1);arr.forEach(r=>r.ex=cnt[r.rang]>1);
}
function statsOf(res){const v=Object.values(res).map(r=>r.moy).filter(x=>x!=null);if(!v.length)return null;
 return {moy:round2(v.reduce((s,x)=>s+x,0)/v.length),max:Math.max(...v),min:Math.min(...v),n:v.length,admis:v.filter(x=>x>=S().seuil).length}}
function classResults(cid,T,a){const c=cls(cid),res={};classInscs(cid,a).forEach(i=>res[i.id]=scoreOf(i.id,T,c));rankInto(res);return {res,stats:statsOf(res)}}
function annualResults(cid,a,upto){
 const c=cls(cid),res={};upto=upto||3;
 classInscs(cid,a).forEach(i=>{const tri=TRIMS.map((T,k)=>k<upto?scoreOf(i.id,T,c).moy:null);const v=tri.filter(x=>x!=null);res[i.id]={tri,moy:v.length?round2(v.reduce((s,x)=>s+x,0)/v.length):null}});
 rankInto(res);return {res,stats:statsOf(res)};
}
function rangTxt(r,sexe){if(!r||!r.rang)return '—';return (r.rang===1?(sexe==='F'?'1ère':'1er'):r.rang+'e')+(r.ex?' ex':'')}
function proposition(i,r){const c=cls(i.classeId);if(!c)return '';if(c.ecole==='maternelle')return 'Admis(e)';if(!r||r.moy==null)return '';return r.moy>=S().seuil?'Admis(e)':'Redouble'}
function decisionLabel(d,c){if(!d)return '';if(d==='Admis(e)'){const nx=NEXT[c.niveau];return nx?`Admis(e) en classe de ${nx}`:'Admis(e) — fin de cycle'}return d}

function brandHTML(){return `<div class="brand"><span class="lg"><img src="${LOGO_COLOR}" alt="Logo"></span><div>EAenJC<small>Gestion scolaire · ${esc(S().annee)}</small></div></div>`}
function render(){
 const lb=S().lastBackup,r=role();
 if(!r){document.getElementById('nav').innerHTML=brandHTML()+`<div class="foot"><div id="syncst" style="color:#e2e8f0">${esc(syncLabel())}</div></div>`;
  document.getElementById('main').innerHTML=syncBanner()+vLogin();setTimeout(()=>{const x=document.getElementById('login_pin');if(x)x.focus()},50);return}
 if(ADMIN_VIEWS.includes(UI.view)&&r!=='admin')UI.view='dash';
 document.getElementById('nav').innerHTML=brandHTML()+NAV_GROUPS.map(([g,ks])=>(g?`<div class="grp">${esc(g)}${g==='Direction'?navIc('lock',12):''}</div>`:'')+ks.map(k=>`<a class="${UI.view===k?'active':''}" onclick="go('${k}')">${navIc(NAV_ICON[k])}<span>${VIEWS[k][0]}${ADMIN_VIEWS.includes(k)&&r!=='admin'?' 🔒':''}</span></a>`).join('')).join('')+
  `<div class="foot"><div style="font-size:11px;color:var(--side-muted);margin-bottom:6px">Version du programme : ${APP_VERSION}</div>${secured()?`<div style="margin-bottom:8px;color:#e2e8f0">Connecté : <b>${r==='admin'?'Direction':'Comptable'}</b></div><button onclick="lockNow()">🔒 Verrouiller</button>${r==='admin'&&S().pinStaff?`<button onclick="ROLE='staff';render()">Passer en mode comptable</button>`:''}`:''}<div id="syncst" style="margin:6px 0 8px;color:#e2e8f0">${esc(syncLabel())}</div>${devName()?`<div style="margin-bottom:8px">Ordinateur : ${esc(devName())}</div>`:''}<button onclick="downloadBackup()">Télécharger une sauvegarde</button>Dernière sauvegarde :<br>${lb?fmtDate(lb.slice(0,10)):'jamais'}</div>`;
 document.getElementById('main').innerHTML=(TRY?`<div class="banner" style="border:2px solid #b42318;background:#fff4f2"><b>MODE ESSAI</b> — vous pouvez tout essayer : rien n'est enregistré (ni dans ce navigateur, ni dans le fichier partagé). Les reçus imprimés portent la mention « ESSAI ». <button class="small primary" onclick="stopEssai()">Terminer l'essai</button></div>`:'')+VIEWS[UI.view][1]();

function backupBanner(){
 let html=syncBanner();
 if(!STORAGE_OK)html+=`<div class="banner"><b>Enregistrement automatique indisponible</b> dans ce navigateur. Téléchargez une sauvegarde après chaque séance de travail, et restaurez-la la fois suivante.</div>`;
 const lb=S().lastBackup,days=lb?Math.floor((Date.now()-new Date(lb))/864e5):null;
 if(DB.eleves.length&&FSTATE!=='ok'&&(days===null||days>=7))html+=`<div class="banner">${days===null?"Aucune sauvegarde n'a encore été téléchargée.":`Dernière sauvegarde il y a ${days} jours.`} Les données sont gardées dans ce navigateur : gardez aussi une copie sur clé USB. <button class="small" onclick="downloadBackup()">Télécharger maintenant</button></div>`;
 return html;
}

async function photoSave(eid,file){

 const cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d');cx.imageSmoothingQuality='high';cx.drawImage(bmp,sx,sy,sw,sh,0,0,W,H);

 const name=photoNames(e)[0];const fh=await PDIR.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(blob);await w.close();

}

function reinscList(){
 const a=S().annee;return DB.eleves.filter(e=>e.statut==='Actif'&&!inscOf(e.id)).map(e=>{const last=DB.inscriptions.filter(i=>i.eleveId===e.id&&i.annee<a&&!i.arrOnly).sort((x,y)=>y.annee.localeCompare(x.annee))[0];const cid=suggestClass(e.id);return {e,last,cid}}).filter(x=>x.cid||x.last).sort((x,y)=>NIV_ALL.indexOf(cls(x.cid)?.niveau)-NIV_ALL.indexOf(cls(y.cid)?.niveau)||byName(x.e,y.e));
}
function nonRevenu(eid){const e=elv(eid);if(!e||!confirm(`Marquer ${fullName(e)} comme « Non revenu » ? Il/elle disparaîtra de la liste à réinscrire (vous pourrez le changer dans sa fiche).`))return;const before=JSON.parse(JSON.stringify(e));e.statut='Non revenu';hRecord('eleve',e,before,e.id);logJ('Non revenu',fullName(e));save();render()}
function reinscCard(){
 const L=reinscList();if(!L.length)return `<div class="card" style="padding:10px 14px"><b>Anciens élèves à réinscrire (0)</b> <span class="muted">— aucun élève en attente. Après la fin d'année (passage), les élèves de l'année précédente apparaîtront ici. Un élève marqué « Non revenu » se retrouve avec la recherche ci-dessus.</span></div>`;
 const rows=L.map(x=>{const e=x.e,c=cls(x.cid),lc=x.last?cls(x.last.classeId):null,ar=arrPending(e.id);const toP=c&&c.ecole==='primaire'&&String(e.matricule||'').startsWith(S().prefixes.maternelle||'M');
  return `<tr data-s="${rowKey(e)}"><td><b>${esc(fullName(e))}</b></td><td>${esc(e.matricule)}</td><td>${lc?esc(lc.nom)+' <span class="muted">'+esc(x.last.annee)+'</span>'+(x.last.decision?'<br><span class="muted">'+esc(x.last.decision)+'</span>':''):'<span class="muted">à confirmer</span>'}</td><td><b>${esc(c?.nom||'?')}</b>${toP?'<br><span class="muted">nouveau n° P</span>':''}</td><td class="num">${ar?fcfa(ar):'—'}</td><td style="white-space:nowrap">${c?`<button class="primary small" onclick="formInscription(null,'${e.id}','${c.id}')">Inscrire en ${esc(c.nom)}</button>`:`<button class="small" onclick="formInscription(null,'${e.id}','')">Inscrire</button>`} <button class="small" onclick="nonRevenu('${e.id}')" title="L'élève n'est pas revenu cette année">Non revenu</button></td></tr>`}).join('');
 return `<div class="card" style="padding:0;overflow:auto"><div class="row" style="padding:10px 14px;align-items:center;justify-content:space-between"><b>Anciens élèves à réinscrire (${L.length})</b><input oninput="filterRows('tb_re',this.value)" placeholder="Rechercher (nom ou numéro)" style="max-width:280px"></div>
 <div style="max-height:420px;overflow:auto"><table class="data"><thead><tr><th>Élève</th><th>N°</th><th>Année passée</th><th>Classe ${esc(S().annee)}</th><th class="num">Arriéré</th><th></th></tr></thead><tbody id="tb_re">${rows}</tbody></table></div></div>`;
}
function vInscrire(){
 return `${backupBanner()}<h1>Inscrire un élève — ${esc(S().annee)}</h1>
 <div class="card"><div class="field"><label style="font-size:14px;color:var(--ink)"><b>1.</b> Cherchez l'élève par son nom ou son numéro</label><input id="ins_q" style="font-size:17px;padding:10px;max-width:520px" placeholder="ex. Sanou Rosalie, 0179 ou P0179" value="${esc(UI.f.insq||'')}" oninput="UI.f.insq=this.value;fillInscrire()" autocomplete="off"></div>
 <div id="ins_res" style="margin-top:10px"></div>
 <div class="row" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px;align-items:center"><span><b>2.</b> L'élève n'a jamais fréquenté l'école ?</span><button class="primary" onclick="formEleve(null,'',fval('ins_q'))">+ Nouvel élève</button></div></div>
 ${reinscCard()}
 <div class="card" style="padding:10px 14px">Inscriptions aujourd'hui : <b>${yearInscs().filter(i=>i.date===today()).length}</b> &nbsp;·&nbsp; inscrits en ${esc(S().annee)} : <b>${yearInscs().length}</b> <span class="muted">— le détail par période se trouve dans « Listes &amp; impressions ».</span></div>`;
}
function fillInscrire(){
 const box=document.getElementById('ins_res');if(!box)return;const raw=fval('ins_q'),q=norm(raw),digits=q.replace(/[^0-9]/g,'');
 if(q.length<2){box.innerHTML='<div class="muted">Tapez au moins 2 lettres ou chiffres.</div>';return}
 const L=DB.eleves.filter(e=>{const k=norm(fullName(e)+' '+e.matricule+' '+(e.matriculeMat||''));return k.includes(q)||(digits&&/^[a-z]?\d+$/.test(q.replace(/\s/g,''))&&[e.matricule,e.matriculeMat].some(m=>String(m||'').replace(/\D/g,'').endsWith(digits.padStart(4,'0'))))}).sort(byName);
 if(!L.length){box.innerHTML=`<div class="banner" style="background:#f4f6f8;border-color:#e2e6ea">Aucun élève trouvé pour « ${esc(raw)} ». Si c'est un nouvel élève, cliquez sur <b>+ Nouvel élève</b> ci-dessous.</div>`;return}
 box.innerHTML=`<table class="data"><thead><tr><th>Élève</th><th>Né(e) le</th><th>Parcours</th><th>Statut</th><th></th></tr></thead><tbody>${L.slice(0,15).map(e=>{const cur=inscOf(e.id);const last=DB.inscriptions.filter(i=>i.eleveId===e.id&&i.annee<S().annee).sort((a,b)=>b.annee.localeCompare(a.annee))[0];
  const parc=last?`${esc(cls(last.classeId)?.nom||'')} en ${esc(last.annee)}`:(e.niveauPrevu?`attendu en ${esc(e.niveauPrevu)}`:'—');
  return `<tr><td><b>${esc(fullName(e))}</b><br><span class="muted">${esc(e.matricule)} · ${esc(e.sexe)}</span></td><td>${fmtDate(e.dateNaiss)}</td><td>${parc}</td><td>${statTag(e.statut)}</td><td style="white-space:nowrap">${cur?`<span class="tag ok">Déjà inscrit(e) en ${esc(cls(cur.classeId)?.nom||'')}</span> <button class="small" onclick="formPaiement('${cur.id}')">Paiement</button>`:`<button class="primary small" onclick="formInscription(null,'${e.id}',suggestClass('${e.id}'))">Inscrire</button>`} <button class="small" onclick="openFiche('${e.id}')">Fiche</button></td></tr>`}).join('')}</tbody></table>${L.length>15?`<div class="muted" style="margin-top:6px">${L.length} élèves trouvés — précisez la recherche.</div>`:''}`;
}
function suggestClass(eid){
 const a=S().annee,e=elv(eid);const prev=DB.inscriptions.filter(i=>i.eleveId===eid&&i.annee<a&&!i.arrOnly).sort((x,y)=>y.annee.localeCompare(x.annee))[0];
 let niv=null;if(prev){const c=cls(prev.classeId);if(c)niv=prev.decision==='Redouble'?c.niveau:(NEXT[c.niveau]||null)}else if(e?.niveauPrevu)niv=e.niveauPrevu;
 return niv?(findClassByNiveau(niv)?.id||''):'';
}
function afterInscription(iid){
 const i=ins(iid);if(!i)return;const e=elv(i.eleveId);
 modal(`<h3>✓ Inscription enregistrée</h3><p><b>${esc(fullName(e))}</b> (${esc(e.matricule)}) est inscrit(e) en <b>${esc(cls(i.classeId)?.nom||'')}</b> pour ${esc(i.annee)}.</p>${e.matriculeMat&&!DB.inscriptions.some(x=>x.eleveId===e.id&&x.id!==i.id&&cls(x.classeId)?.ecole==='primaire')?`<p>Nouveau numéro au primaire : <b>${esc(e.matricule)}</b> (ancien numéro maternelle : ${esc(e.matriculeMat)}).</p>`:''}<p>Montant à payer pour l'année : <b>${fcfa(du(i))}</b>${i.arriere?` (dont arriéré ${fcfa(i.arriere)})`:''}.</p>
 <div class="actions"><button onclick="closeModal()">Plus tard</button><button class="primary" onclick="formPaiement('${iid}')">Recevoir le premier paiement</button></div>`);
}

/* ---------- Inscriptions ---------- */
function vInscr(){
 const a=S().annee,cl=UI.f.icl||'',money=isAdmin()&&UI.f.imoney;
 let L=cl?classInscs(cl):yearInscs().sort((x,y)=>NIV_ALL.indexOf(cls(x.classeId)?.niveau)-NIV_ALL.indexOf(cls(y.classeId)?.niveau)||byName(elv(x.eleveId),elv(y.eleveId)));
 if(UI.f.ibours)L=L.filter(i=>elv(i.eleveId)?.boursier);
 let tD=0,tP=0,tR=0,g=0,f=0;
 const rows=L.map((i,k)=>{const e=elv(i.eleveId);e?.sexe==='F'?f++:g++;let mc='';if(money){const d=du(i),p=paye(i.id),r=reste(i);tD+=d;tP+=p;tR+=r;mc=`<td class="num">${fcfa(d)}</td><td class="num">${fcfa(p)}</td><td class="num">${r>0?`<span style="color:var(--danger)">${fcfa(r)}</span>`:'<span class="tag ok">soldé</span>'}</td>`}
  return `<tr data-s="${rowKey(e)}"><td>${k+1}</td><td>${esc(e?.matricule)}</td><td><a href="#" onclick="openFiche('${i.eleveId}');return false"><b>${esc(fullName(e))}</b></a>${e?.boursier?' <span class="tag">boursier</span>':''}</td><td>${esc(e?.sexe)}</td><td>${fmtDate(e?.dateNaiss)}</td><td>${esc(cls(i.classeId)?.nom||'')}</td><td>${esc(i.type)}${i.redoublant?' <span class="tag warn">redoublant(e)</span>':''}</td><td>${[e?.tuteur||e?.pere||e?.mere,e?.telephone].filter(Boolean).map(esc).join('<br>')}</td>${mc}<td style="white-space:nowrap"><button class="small" onclick="formInscription('${i.id}')">Modifier</button></td></tr>`}).join('');
 const nc=money?12:9;
 return `${backupBanner()}<h1>Classes et effectifs ${esc(a)}</h1>
 <div class="card row">${FS('Classe','i_cl','<option value="">Toutes les classes</option>'+classOpts(cl),'onchange="UI.f.icl=this.value;render()"')}
 <div class="field" style="min-width:220px"><label>Rechercher (nom ou numéro)</label><input oninput="filterRows('tb_i',this.value)" placeholder="ex. 0178 ou Sanou"></div><label style="display:flex;gap:6px;align-items:center;padding-bottom:8px"><input type="checkbox" ${UI.f.ibours?'checked':''} onchange="UI.f.ibours=this.checked;render()"> Boursiers seulement</label><button class="primary" onclick="go('inscrire')">+ Inscrire un élève</button>
 ${cl?`<button onclick="printDoc(listeHTML('${cl}'))">Imprimer la liste de classe</button>`:''}<span style="flex:1"></span>${isAdmin()?`<button onclick="UI.f.imoney=!UI.f.imoney;render()">${money?'Masquer les montants':'Afficher les montants'}</button>`:''}</div>
 <div class="card" style="padding:0;overflow:auto"><table class="data"><thead><tr><th>N°</th><th>Matricule</th><th>Nom et prénoms</th><th>Sexe</th><th>Né(e) le</th><th>Classe</th><th>Type</th><th>Parent / Téléphone</th>${money?'<th class="num">Dû</th><th class="num">Payé</th><th class="num">Reste</th>':''}<th></th></tr></thead>
 <tbody id="tb_i">${rows||`<tr><td colspan="${nc}" class="muted" style="padding:24px;text-align:center">Aucune inscription.</td></tr>`}</tbody>
 ${L.length?`<tfoot><tr><td colspan="8">${L.length} élève(s) — ${g} garçon(s), ${f} fille(s)</td>${money?`<td class="num">${fcfa(tD)}</td><td class="num">${fcfa(tP)}</td><td class="num">${fcfa(tR)}</td>`:''}<td></td></tr></tfoot>`:''}</table></div>`;
}
function formInscription(iid,eid,presetCid){
 const a=S().annee;let i=iid?ins(iid):null;if(!i&&eid)i=inscOf(eid)||null;
 const pick=eid||i?.eleveId;
 const eleveSel=pick?`<input type="hidden" id="f_e" value="${pick}"><div class="field"><label>Élève</label><b style="padding:6px 0">${esc(fullName(elv(pick)))}</b></div>`
  :pickerHTML('f_e','Élève * (nom ou numéro)',DB.eleves.filter(e=>!inscOf(e.id)&&!['Sorti (fin de cycle)','Exclu'].includes(e.statut)).sort(byName).map(e=>[e.id,fullName(e)+' — '+e.matricule,e.matricule]),'autoType');
 const cid=i?.classeId||presetCid||UI.f.icl||'';const c0=cls(cid);
 const typeDef=i?.type||(pick&&DB.inscriptions.some(x=>x.eleveId===pick&&x.annee!==a&&!x.arrOnly)?'Ancien':'Nouveau');
 modal(`<h3>${i?"Modifier l'inscription":'Inscription'} ${esc(a)}</h3><div class="form-grid">${eleveSel}
 ${FS('Classe *','f_cl','<option value="">— choisir —</option>'+classOpts(cid),'onchange="prefillFees()"')}
 ${FS('Type','f_type',opts(['Nouveau','Ancien'],typeDef))}
 ${FS('Redoublant(e)','f_red',opts([['0','Non'],['1','Oui']],(i?i.redoublant:(pick&&DB.inscriptions.filter(x=>x.eleveId===pick&&x.annee<S().annee&&!x.arrOnly).sort((x,y)=>y.annee.localeCompare(x.annee))[0]?.decision==='Redouble'))?'1':'0'))}
 ${F("Date d'inscription",'f_dt',i?.date||today(),'date')}
 </div>
 ${(()=>{const arr0=i?(i.arriere||0):((pick&&arrPending(pick)+(arrOnlyOf(pick)?paidC(arrOnlyOf(pick).id,'arriere'):0))||0),rem0=i?.remise||0,ad=isAdmin();
  return `<div id="f_fees_sum" data-iid="${i?.id||''}" data-cid0="${esc(i?.classeId||'')}" style="margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:12px 14px"></div>
  <div class="form-grid" style="margin-top:10px">${ad?F('Réduction sur la scolarité (F)','f_rem',rem0,'number','min="0" step="any" oninput="feesSum()"')+(i?F('Motif de la réduction (si modifiée)','f_remm','','text'):'')+`<input type="hidden" id="f_arr" value="${arr0}">`:`<input type="hidden" id="f_rem" value="${rem0}"><input type="hidden" id="f_arr" value="${arr0}"><div class="field" style="grid-column:1/-1"><span class="muted" style="font-size:12px">Les frais sont ceux de la classe. La réduction ne se modifie qu'avec le code de la direction. L'arriéré des années passées vient automatiquement.</span></div>`}</div>`})()}<div class="actions">${i?`<button class="danger" style="margin-right:auto" onclick="delInscription('${i.id}')">Annuler cette inscription</button>`:''}<button onclick="closeModal()">Annuler</button><button class="primary" onclick="saveInscription('${i?.id||''}')">Enregistrer</button></div>`);feesSum();
}
function autoType(){const e=fval('f_e');const t=document.getElementById('f_type');if(t&&e)t.value=DB.inscriptions.some(x=>x.eleveId===e)?'Ancien':'Nouveau'}
function feesOf(){const box=document.getElementById('f_fees_sum');const cid=fval('f_cl'),c=cls(cid);if(!c)return null;const i=box&&box.dataset.iid?ins(box.dataset.iid):null;return (i&&cid===box.dataset.cid0)?Object.assign(zeroFrais(),i.frais||{}):Object.assign(zeroFrais(),c.frais||{})}
function feesSum(){const box=document.getElementById('f_fees_sum');if(!box)return;const c=cls(fval('f_cl')),fr=feesOf();if(!c||!fr){box.innerHTML='<span class="muted">Choisissez une classe pour voir les frais.</span>';return}
 const rem=+fval('f_rem')||0,arr=+fval('f_arr')||0,tot=RUB().reduce((s,r)=>s+(+fr[r.k]||0),0);
 box.innerHTML=`<div style="font-weight:600;margin-bottom:6px">Frais de la classe ${esc(c.nom)}</div><div>${RUB().filter(r=>+fr[r.k]).map(r=>`${esc(r.l)} ${fcfa(fr[r.k])}`).join(' · ')||'—'} → total <b>${fcfa(tot)}</b></div>${rem?`<div>Réduction : ${fcfa(rem)} → <b>à payer ${fcfa(Math.max(0,tot-rem))}</b></div>`:''}${arr?`<div class="muted">Arriéré des années passées (à part, reçus série A) : ${fcfa(arr)}</div>`:''}`}
function prefillFees(){feesSum()}
function saveInscription(id){
 const eid=fval('f_e'),cid=fval('f_cl');if(!eid){alert('Choisissez un élève.');return}if(!cid){alert('Choisissez une classe.');return}
 const frais=feesOf();const i00=id?ins(id):null;let rem=+fval('f_rem')||0,arr=+fval('f_arr')||0;
 if(!isAdmin()&&i00){rem=+i00.remise||0;arr=+i00.arriere||0}
 if(i00&&isAdmin()&&rem!==(+i00.remise||0)){const m=(fval('f_remm')||'').trim();if(!m){alert('Indiquez le motif de la modification de la réduction.');return}logJ('Réduction modifiée',`${fullName(elv(eid))} : ${fcfa(+i00.remise||0)} → ${fcfa(rem)} — ${m}`)}
 const data={classeId:cid,type:fval('f_type'),redoublant:fval('f_red')==='1',frais,remise:rem,date:fval('f_dt')};
 let newI=null;if(id){const i0=ins(id),before=JSON.parse(JSON.stringify(i0));Object.assign(i0,data,{arriere:arr});hRecord('inscription',i0,before,i0.eleveId,i0.id)}else{if(inscOf(eid)){alert('Cet élève est déjà inscrit cette année.');return}const e=elv(eid);if(e){e.arriereEnAttente=0;e.statut='Actif'}newI=createInscription(eid,cid,null,Object.assign(data,{arriere:arr}));logJ('Inscription',`${fullName(e)} — ${cls(cid)?.nom} ${S().annee}`)}
 save();closeModal();render();if(newI)afterInscription(newI.id);else toast('Inscription enregistrée');
}
function delInscription(iid){requirePin(()=>delInscription2(iid),'annuler une inscription')}
function delInscription2(iid){
 const n=DB.paiements.filter(p=>p.inscriptionId===iid).length;
 if(n){alert("Cette inscription a des paiements : elle ne peut pas être annulée.\nSi l'élève est parti, changez son statut (Abandon, Transféré…) dans sa fiche.");return}
 if(!confirm(`Annuler cette inscription ?${n?`\n${n} paiement(s) et les notes de cette année seront aussi supprimés.`:'\nLes notes de cette année seront aussi supprimées.'}`))return;
 const i0=ins(iid);logJ('Inscription annulée',`${fullName(elv(i0?.eleveId))} — ${cls(i0?.classeId)?.nom||''} ${i0?.annee||''}`);DB.inscriptions=DB.inscriptions.filter(i=>i.id!==iid);delete DB.evals[iid];save();closeModal();render();
}

 return `<div class="pg">${pageHeader(ec?S().ecoles[ec]:{nom:'Écoles Être et Avoir en Jésus-Christ (primaire et maternelle)'},S().annee)}<div class="title">Clôture de caisse du ${fmtDate(d)}${ec?' — '+(ec==='primaire'?'Primaire':'Maternelle'):''}</div>
 <table class="small"><thead><tr><th>Reçu</th><th>Élève</th><th>Classe</th><th>Mode</th>${K.map(k=>`<th class="r">${esc(rubLabel(k))}</th>`).join('')}<th class="r">Total</th></tr></thead><tbody>${rows||`<tr><td colspan="${5+K.length}" class="c">Aucun reçu ce jour</td></tr>`}</tbody>
 <tfoot><tr><th colspan="4">Total (${P.length} reçu(s))</th>${K.map(k=>`<th class="r">${fcfa(tk[k])}</th>`).join('')}<th class="r">${fcfa(T)}</th></tr></tfoot></table>

function formDep(id){

 modal(`<h3>${x?'Modifier la dépense N° '+esc(x.recu):'Nouvelle dépense'}</h3><div class="form-grid">

function saveDep(id){
 const d=fval('dp_d'),ds=(fval('dp_ds')||'').trim(),c=fval('dp_c'),m=+fval('dp_m');
 if(!d||!ds||!c||!(m>0)){alert('Remplissez la date, la description, la catégorie et le montant.');return}
 const data={date:d,desc:ds,cat:c,montant:m,source:fval('dp_s')||'Caisse Générale',fournisseur:fval('dp_f'),obs:fval('dp_o')};
 if(id){const x=DB.depenses.find(y=>y.id===id);const b=Object.assign({},x);Object.assign(x,data);const ch=['date','desc','cat','montant','source','fournisseur','obs'].filter(k=>String(b[k]??'')!==String(x[k]??'')).map(k=>`${k} : ${k==='montant'?fcfa(b[k]):(b[k]||'—')} → ${k==='montant'?fcfa(x[k]):(x[k]||'—')}`).join(' ; ');logJ('Dépense modifiée',`N° ${x.recu} — ${ch||'aucun changement'}`)}
 else{const x=Object.assign({id:uid(),recu:depTake(d.slice(0,4)),by:devName()||''},data);DB.depenses.push(x);logJ('Dépense',`N° ${x.recu} — ${x.desc} — ${fcfa(x.montant)}`);toast('Dépense enregistrée — reçu N° '+x.recu)}
 save();closeModal();render();
}

 x.annule={t:new Date().toISOString(),motif:m,dev:devName()||''};logJ('Dépense annulée',`N° ${x.recu} — ${x.desc} — ${fcfa(x.montant)} — motif : ${m}`);save();render()},'annuler une dépense')}

function fillPaie(){
 const box=document.getElementById('pres');if(!box)return;const raw=(UI.f.pq||'').trim(),q=norm(raw);
 if(q.length<2){box.innerHTML='';return}
 const rq=q.replace(/\s/g,'');let RB='';
 if(/^(\d{4}-\d{2}-)?[pma]\d+$/.test(rq)){const key=rq.replace(/^.*?([pma])(\d+)$/,(m,x,y)=>x+y.padStart(4,'0'));const R=DB.paiements.filter(p=>norm(p.recu||'').endsWith(key));
  if(R.length)RB=`<div class="card" style="padding:0;overflow:auto"><div style="padding:10px 14px;font-weight:600">Reçu(s) ${esc(raw)}</div><table class="data"><thead><tr><th>Date</th><th>Reçu N°</th><th>Élève</th><th>Classe</th><th>Détail</th><th>Mode</th><th class="num">Montant</th><th></th></tr></thead><tbody>${R.map(p=>payRow(p,true)).join('')}</tbody></table></div>`}
 const digits=q.replace(/[^0-9]/g,'');
 const L=DB.eleves.filter(e=>{const k=norm(fullName(e)+' '+e.matricule+' '+(e.matriculeMat||''));return k.includes(q)||(digits&&/^[a-z]?\d+$/.test(rq)&&[e.matricule,e.matriculeMat].some(m=>String(m||'').replace(/\D/g,'').endsWith(digits.padStart(4,'0'))))}).sort((a,b)=>(inscOf(b.id)?1:0)-(inscOf(a.id)?1:0)||byName(a,b));

 if(L.length===1){box.innerHTML=RB+payCard(L[0]);return}
 box.innerHTML=RB+`<div class="card" style="padding:0;overflow:auto"><div style="padding:10px 14px" class="muted">${L.length} élève(s) — cliquez sur un nom</div><table class="data"><tbody>${L.slice(0,30).map(e=>{const i=inscOf(e.id);return `<tr><td><a href="#" onclick="UI.f.pq='${esc(e.matricule)}';document.getElementById('pq').value='${esc(e.matricule)}';fillPaie();return false"><b>${esc(fullName(e))}</b></a></td><td>${esc(e.matricule)}</td><td>${i?esc(cls(i.classeId)?.nom||''):'<span class="muted">non inscrit(e)</span>'}</td><td class="num">${i?(reste(i)>0?'reste '+fcfa(reste(i)):'<span class="tag ok">soldé</span>'):''}</td></tr>`}).join('')}</tbody></table></div>`;
}

 {const r=document.getElementById('f_r');if(r&&(!r.value||r.dataset.auto==='1')&&!i.arrOnly){const n=DB.paiements.filter(p=>p.inscriptionId===i.id&&!p.annule&&!isArrPay(p)).length;if(TRANCHES[n]){r.value=TRANCHES[n];r.dataset.auto='1'}}}

function logoSrc(){return S().logo===''?'':(S().logo||DEFAULT_LOGO)}
function nombreEnLettres(n){n=Math.round(+n||0);if(n===0)return 'zéro';
 const u=['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
 const t=['','dix','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
 const b100=(n,fin)=>{if(n<20)return u[n];const d=Math.floor(n/10),r=n%10;if(d===7||d===9)return t[d]+(d===7&&r===1?' et ':'-')+u[10+r];let s=t[d];if(r===1&&d<8)s+=' et un';else if(r)s+='-'+u[r];else if(d===8&&fin)s+='s';return s};
 const b1000=(n,fin)=>{const c=Math.floor(n/100),r=n%100;let s='';if(c){s=c===1?'cent':u[c]+' cent';if(!r&&c>1&&fin)s+='s'}if(r)s+=(s?' ':'')+b100(r,fin);return s};
 const m=Math.floor(n/1e6),k=Math.floor(n%1e6/1000),r=n%1000;const out=[];
 if(m)out.push(b1000(m,true)+(m>1?' millions':' million'));
 if(k)out.push(k===1?'mille':b1000(k,false)+' mille');
 if(r)out.push(b1000(r,true));
 return out.join(' ');
}
function paidAsOf(p,k){return DB.paiements.filter(x=>x.inscriptionId===p.inscriptionId&&!x.annule&&((x.date||'')<(p.date||'')||((x.date||'')===(p.date||'')&&(x.recu||'')<=(p.recu||''))||x.id===p.id)).reduce((s,x)=>s+(+(x.parts||{})[k]||0),0)}
function recuHTML(p){
 const i=ins(p.inscriptionId),e=elv(i.eleveId),c=cls(i.classeId)||{nom:'Arriéré seul (non inscrit)',ecole:insEcole(i)},sc=ecoleOf(c);
 const AR=isArrPay(p);const K=AR?['arriere']:keysAll().filter(k=>+(p.parts||{})[k]||(k!=='arriere'&&dueC(i,k)));const dense=K.length>=4||!!p.annule;
 let tP=0,tR=0,tPaid=0,tDue=0;
 const lines=K.map(k=>{const d=dueC(i,k),pa=p.annule?paidC(i.id,k):paidAsOf(p,k),r=Math.max(0,d-pa),now=+(p.parts||{})[k]||0;tP+=now;tR+=r;tPaid+=pa;tDue+=d;return `<tr><td>${esc(rubLabel(k))}</td><td class="r">${now?fcfa(now):'—'}</td><td class="r">${r?fcfa(r):'Soldé'}</td></tr>`}).join('');
 const lg=logoSrc();
 const nm=String(sc.nom||''),cut=nm.search(/\sÊtre\s/),n1=cut>0?nm.slice(0,cut):nm,n2=cut>0?nm.slice(cut+1):'';
 const sub=[sc.arrete?esc(sc.arrete):'',[sc.adresse,sc.tel?'Tél. : '+sc.tel:''].filter(Boolean).map(esc).join(' · ')].filter(Boolean);
 const hdr=`<div style="display:grid;grid-template-columns:30mm 1fr 30mm;align-items:center;border-bottom:2px solid #000;padding-bottom:5px">
 <div>${lg?`<img src="${lg}" alt="" style="height:${dense?17:22}mm;width:auto;display:block">`:''}</div>
 <div style="text-align:center;line-height:1.25"><b style="font-size:${dense?16:18}px">${esc(n1)}</b>${n2?`<br><b style="font-size:${dense?16:18}px">${esc(n2)}</b>`:''}${sc.devise?`<br><i>${esc(sc.devise)}</i>`:''}<br><span style="font-size:11px">${sub.join('<br>')}</span></div>
 <div style="text-align:right;white-space:nowrap">Année scolaire<br><b style="font-size:14px">${esc(i.annee)}</b></div></div>`;
 const one=lab=>`<div class="recu-box${dense?' dense':''}">${hdr}
 <div><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><span style="font-size:20px;font-weight:bold;text-transform:uppercase">${AR?'Reçu d\'arriéré':'Reçu'} N° ${esc(p.recu)}</span><span style="border:${p.annule?2:1}px solid #000;padding:2px 8px;font-weight:bold">${TRY?'ESSAI — ':''}${p.annule?'ANNULÉ — ':''}${lab}</span></div>
 <table class="info"><tr><td style="width:62%">Élève : <b>${esc(fullName(e))}</b> (${esc(e.matricule)}) — Classe : <b>${esc(c.nom)}</b></td><td>Date : <b>${fmtDate(p.date)}</b></td></tr><tr><td>${p.annule?`<b>Annulé le ${fmtDate(p.annule.t.slice(0,10))} — motif : ${esc(p.annule.motif)}</b>`:`Objet : ${esc(AR?'Paiement d\'arriéré des années passées'+(p.remarque&&p.remarque!=='Arriéré des années passées'?' — '+p.remarque:''):(p.remarque||'Paiement des frais scolaires'))}`}</td><td>Mode : ${esc(p.mode||'')}</td></tr></table></div>
 <table><thead><tr><th>Rubrique</th><th class="r" style="width:32%">Montant payé</th><th class="r" style="width:32%">Reste à payer</th></tr></thead><tbody>${lines}</tbody><tfoot><tr><th>TOTAL</th><th class="r" style="font-size:16px">${fcfa(tP)}</th><th class="r">${fcfa(tR)}</th></tr></tfoot></table>
 <div><div>Arrêté le présent reçu à la somme de : <b>${nombreEnLettres(tP)} (${fcfa(tP).replace(' F','')}) francs CFA</b>.</div>
 <div style="font-size:12px;margin-top:2px">Situation au ${fmtDate(p.date)} : payé ${AR?'sur l\'arriéré':'pour l\'année'} ${fcfa(tPaid)} sur ${fcfa(tDue)} — reste ${fcfa(tR)}.</div></div>

 return `<div class="pg recu-page"><div class="recu-wrap"><div class="recu-half">${one('Copie PARENTS')}</div><div class="recu-cut">✂ ${'- '.repeat(70)}✂</div><div class="recu-half">${one('Copie ÉCOLE')}</div></div></div>`;
}

const MOIS_FR=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function moisLabel(ym){const [y,m]=ym.split('-');return MOIS_FR[+m-1].replace(/^./,c=>c.toUpperCase())+' '+y}
function recapData(ec,d1,d2){
 d1=d1||today().slice(0,4)+'-01-01';d2=d2||today();
 const P=DB.paiements.filter(p=>{const i=ins(p.inscriptionId);return i&&!p.annule&&p.date&&p.date>=d1&&p.date<=d2&&(!ec||insEcole(i)===ec)}).map(schoolPay).filter(Boolean);
 const K0=keysSchool().filter(k=>k!=='arriere'),KE=[];
 const P0=P;P.splice(0,P.length,...P0.filter(p=>partsK(p,K0)>0));
 const KY=[];
 const months=[];let y=+d1.slice(0,4),m=+d1.slice(5,7);const ye=+d2.slice(0,4),me=+d2.slice(5,7);
 while(y<ye||(y===ye&&m<=me)){months.push(y+'-'+String(m).padStart(2,'0'));m++;if(m>12){m=1;y++}}
 const blank=()=>({k:Object.fromEntries(KY.map(k=>[k,0])),an:0,ext:0,tot:0,n:0});
 const R={},T=blank();months.forEach(x=>R[x]=blank());
 P.forEach(p=>{const r=R[p.date.slice(0,7)];if(!r)return;[r,T].forEach(o=>{KY.forEach(k=>o.k[k]+=+(p.parts||{})[k]||0);o.an+=partsK(p,K0);o.tot+=partsK(p,K0);o.n++})});
 const civ=d1.slice(5)==='01-01'&&d2.slice(5)==='12-31'&&d1.slice(0,4)===d2.slice(0,4);
 const lab=civ?'Année civile '+d1.slice(0,4):`Du ${fmtDate(d1)} au ${fmtDate(d2)}`;
 return {d1,d2,civ,lab,ec,KY,KE,R,T,months};
}

 const head=`<th>Mois</th>${D.KY.map(k=>`<th class="r">${esc(rubLabel(k))}</th>`).join('')}<th class="r">Recettes de l'école</th><th class="r">Nombre de reçus</th>${D.KE.length?`<th class="r">${D.KE.map(rubLabel).join(' + ')} (hors école)</th><th class="r">Total encaissé</th>`:''}`;

 const rows=D.months.map(m=>line(moisLabel(m),D.R[m])).join('');const T=D.T;

 return `<div class="pg">${pageHeader(ec?S().ecoles[ec]:{nom:'Écoles Être et Avoir en Jésus-Christ (primaire et maternelle)'},D.civ?D.d1.slice(0,4):S().annee).replace('Année scolaire<br>',D.civ?'Année civile<br>':'Année scolaire<br>')}<div class="title">Récapitulatif mensuel des recettes — ${esc(nom)}</div><p>${esc(D.lab)} · arrêté au ${fmtDate(today())} · ${T.n} reçu(s), reçus annulés exclus</p>

 ${D.KE.length?`<tr><td>${D.KE.map(rubLabel).join(' + ')} — encaissé pour le compte des parents, hors recettes de l'école</td><td class="r">${fcfa(T.ext)}</td></tr><tr><td>Total encaissé (tout compris)</td><td class="r">${fcfa(T.tot)}</td></tr>`:''}
 </tbody></table>

}

 const E=arrEntrees(d1,d2),O=arrSorties(d1,d2),te=E.reduce((s,p)=>s+(+p.parts.arriere||0),0),to=O.reduce((s,x)=>s+(+x.montant||0),0);

 <p>Période : du ${fmtDate(d1)||'début'} au ${fmtDate(d2)||fmtDate(today())}. Fonds géré à part : ces montants ne font pas partie des recettes de l'année ni de la caisse de l'école.</p>
 <h3 style="margin:8px 0 4px">Entrées (reçus d'arriéré)</h3>

 <h3 style="margin:10px 0 4px">Sorties (utilisation du fonds)</h3>

 <table class="small" style="width:auto;min-width:55%;margin-top:5mm"><tbody>${d1?`<tr><td>Solde au début de la période</td><td class="r">${fcfa(prev)}</td></tr>`:''}<tr><td>+ Entrées</td><td class="r">${fcfa(te)}</td></tr><tr><td>− Sorties</td><td class="r">${fcfa(to)}</td></tr><tr><td><b>Solde à la fin de la période</b></td><td class="r"><b>${fcfa(prev+te-to)}</b></td></tr></tbody></table>

function fondsXLSX(d1,d2){
 const E=arrEntrees(d1,d2),O=arrSorties(d1,d2);
 const r1=[[`Fonds des arriérés — entrées — du ${fmtDate(d1)||'début'} au ${fmtDate(d2)||fmtDate(today())}`],[],['Date','Reçu N°','Matricule','Élève','Mode','Montant']];
 E.forEach(p=>{const e=elv(ins(p.inscriptionId)?.eleveId);r1.push([{d:p.date},p.recu,e?.matricule||'',fullName(e),p.mode||'',+p.parts.arriere||0])});
 const n1=r1.length;r1.push([],['TOTAL','','','','',E.length?{f:`SUM(F4:F${n1})`}:0]);
 const r2=[['Fonds des arriérés — sorties'],[],['Date','Motif / utilisation','Remis à','Montant']];
 O.forEach(x=>r2.push([{d:x.date},x.motif,x.remisA||'',+x.montant||0]));
 const n2=r2.length;r2.push([],['TOTAL','','',O.length?{f:`SUM(D4:D${n2})`}:0],[],['Solde du fonds au '+fmtDate(d2||today()),'','',fondsSolde(d2)]);
 downloadXLSX(`Fonds_arrieres_${d1||'debut'}_${d2||today()}.xlsx`,[{name:'Entrées',rows:r1,bold:[0,2,r1.length-1],widths:[11,15,10,30,12,12],freeze:3},{name:'Sorties',rows:r2,bold:[0,2,r2.length-3,r2.length-1],widths:[11,40,22,12],freeze:3}]);
 logJ('Export Excel','Fonds des arriérés');save();
}
function formFonds(){
 const O=(DB.fondsArr||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 modal(`<h3>Fonds des arriérés (à part)</h3><p>Solde actuel : <b style="font-size:18px">${fcfa(fondsSolde())}</b> <span class="muted">— entrées ${fcfa(arrEntrees().reduce((s,p)=>s+(+p.parts.arriere||0),0))} · sorties ${fcfa(arrSorties().reduce((s,x)=>s+(+x.montant||0),0))}</span></p>
 <div class="card" style="margin:8px 0"><b>Enregistrer une sortie (utilisation du fonds)</b><div class="row" style="margin-top:6px">${F('Date','fs_d',today(),'date')}${F('Montant (F)','fs_m','','number')}<div class="field" style="min-width:240px"><label>Motif / utilisation *</label><input id="fs_mo" placeholder="ex. versé à la caisse de l'école, achat de ..."></div><div class="field"><label>Remis à</label><input id="fs_r"></div><button class="primary" onclick="addSortie()">Enregistrer</button></div></div>
 <table class="data"><thead><tr><th>Date</th><th>Motif</th><th>Remis à</th><th class="num">Montant</th><th></th></tr></thead><tbody>${O.map(x=>`<tr${x.annule?' style="color:#98a2b3"':''}><td>${fmtDate(x.date)}</td><td>${esc(x.motif)}</td><td>${esc(x.remisA||'')}</td><td class="num">${x.annule?`<s>${fcfa(x.montant)}</s> <span class="tag bad">ANNULÉ</span>`:fcfa(x.montant)}</td><td>${x.annule?'':`<button class="small danger" onclick="annulSortie('${x.id}')">Annuler</button>`}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Aucune sortie enregistrée.</td></tr>'}</tbody></table>
 <div class="actions"><button onclick="closeModal()">Fermer</button></div>`,true);

function addSortie(){const m=+fval('fs_m'),mo=fval('fs_mo');if(!(m>0)){alert('Indiquez le montant.');return}if(!mo){alert('Indiquez le motif.');return}
 if(m>fondsSolde()&&!confirm(`Le montant dépasse le solde du fonds (${fcfa(fondsSolde())}). Enregistrer quand même ?`))return;
 const x={id:uid(),date:fval('fs_d')||today(),montant:m,motif:mo,remisA:fval('fs_r'),by:devName()||''};DB.fondsArr.push(x);logJ('Fonds arriérés — sortie',`${fcfa(m)} — ${mo}`);save();formFonds();toast('Sortie enregistrée')}
function annulSortie(id){const x=DB.fondsArr.find(y=>y.id===id);if(!x)return;const mo=prompt('Motif de l\'annulation de cette sortie :');if(!mo)return;x.annule={t:new Date().toISOString(),motif:mo,dev:devName()||''};logJ('Fonds arriérés — sortie annulée',`${fcfa(x.montant)} — ${mo}`);save();formFonds()}

function sYearOfDate(d){const y=+d.slice(0,4),m=+d.slice(5,7);return m>=9?`${y}-${y+1}`:`${y-1}-${y}`}
function prevYear(a){const y=+a.slice(0,4);return `${y-1}-${y}`}
function sheetRecettesRows(d1,d2){
 const NAT={scolarite:'Scolarité',gouter:'Goûter',livres:'Livres'};const KY=keysSchool().filter(k=>k!=='arriere');const G={};
 const add=(date,ec,nat,v,imp)=>{if(!v)return;const k=[date,ec,nat,imp].join('|');G[k]=(G[k]||0)+v};
 DB.paiements.forEach(p=>{if(p.annule||!p.date||p.date<d1||p.date>d2)return;const i=ins(p.inscriptionId);if(!i)return;
  const ec=insEcole(i)==='maternelle'?'Maternelle':'Primaire',pt=p.parts||{};
  const impY=sYearOfDate(p.date)!==i.annee?i.annee:'';
  KY.forEach(k=>add(p.date,ec,NAT[k]||rubLabel(k),+pt[k]||0,impY));
 });
 return Object.entries(G).map(([k,v])=>{const [date,ec,nat,imp]=k.split('|');return [date,ec,nat,v,imp]}).sort((a,b)=>a[0].localeCompare(b[0])||a[1].localeCompare(b[1])||a[2].localeCompare(b[2])||a[4].localeCompare(b[4]));
}
function exportSheetRecettes(d1,d2){
 if(!d1||!d2||d1>d2){alert('Choisissez une période valide.');return}
 const R=sheetRecettesRows(d1,d2);if(!R.length){alert('Aucune recette sur cette période.');return}
 const tsv=R.map(r=>r.join('\t')).join('\n'),tot=R.reduce((s,r)=>s+r[3],0),arr=R.filter(r=>r[4]&&r[4]<sYearOfDate(r[0])).reduce((s,r)=>s+r[3],0);
 modal(`<h3>Recettes pour le « Tableau financier » (Google Sheets)</h3>
 <p>Du ${fmtDate(d1)} au ${fmtDate(d2)} : <b>${R.length} ligne(s)</b>, total <b>${fcfa(tot)}</b>. APE, arriérés des années passées (fonds à part) et reçus annulés exclus.</p>
 <ol style="margin:6px 0 10px 18px;padding:0"><li>Cliquez sur <b>Copier</b>.</li><li>Dans l'onglet <b>Recettes</b>, cliquez dans la colonne <b>A</b> de la première ligne vide, puis collez (Ctrl+V / ⌘V).</li><li>Ne collez pas deux fois la même période.</li></ol>
 <textarea id="tsv_out" readonly style="width:100%;height:220px;font-family:monospace;font-size:12px">${esc(tsv)}</textarea>
 <div class="actions"><button onclick="closeModal()">Fermer</button><button class="primary" onclick="copyTSV()">Copier</button></div>`);
 logJ('Export Tableau financier',`${d1} → ${d2} : ${fcfa(tot)}`);
}
function sheetArrRows(d1,d2){
 const R=arrEntrees(d1,d2).map(p=>{const i=ins(p.inscriptionId),e=elv(i?.eleveId);return [p.date,insEcole(i)==='maternelle'?'Maternelle':'Primaire',`${fullName(e)} (${e?.matricule||''})`,p.recu,+p.parts.arriere||0,'',isArrPay(p)?(p.remarque&&p.remarque!=='Arriéré des années passées'?p.remarque:'Arriéré des années passées'):'Arriéré (reçu mixte)']});
 arrSorties(d1,d2).forEach(x=>R.push([x.date,'','','','',+x.montant||0,x.motif+(x.remisA?' — remis à '+x.remisA:'')]));
 return R.sort((a,b)=>a[0].localeCompare(b[0]));
}
function exportSheetArr(d1,d2){
 if(!d1||!d2||d1>d2){alert('Choisissez une période valide.');return}
 const R=sheetArrRows(d1,d2);if(!R.length){alert('Aucun mouvement du fonds des arriérés sur cette période.');return}
 const tsv=R.map(r=>r.join('\t')).join('\n'),te=R.reduce((s,r)=>s+(+r[4]||0),0),to=R.reduce((s,r)=>s+(+r[5]||0),0);
 modal(`<h3>Arriérés pour le « Tableau financier » (onglet « Arriérés »)</h3>
 <p>Du ${fmtDate(d1)} au ${fmtDate(d2)} : <b>${R.length} ligne(s)</b> — entrées ${fcfa(te)}, sorties ${fcfa(to)}.</p>
 <ol style="margin:6px 0 10px 18px;padding:0"><li>Cliquez sur <b>Copier</b>.</li><li>Dans l'onglet <b>Arriérés</b>, cliquez dans la colonne <b>A</b> de la première ligne vide, puis collez (Ctrl+V / ⌘V). La colonne « Solde » se calcule seule.</li><li>Ne collez pas deux fois la même période.</li></ol>
 <textarea id="tsv_out" readonly style="width:100%;height:200px;font-family:monospace;font-size:12px">${esc(tsv)}</textarea>
 <div class="actions"><button onclick="closeModal()">Fermer</button><button class="primary" onclick="copyTSV()">Copier</button></div>`);
 logJ('Export Tableau financier (arriérés)',`${d1} → ${d2}`);
}
function copyTSV(){const t=document.getElementById('tsv_out');if(!t)return;const done=()=>toast('Copié — collez dans l\'onglet Recettes');
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t.value).then(done,()=>{t.select();document.execCommand('copy');done()});else{t.select();document.execCommand('copy');done()}}
function recettesHTML(ec,d1,d2){

 const used=k=>P.some(p=>+(p.parts||{})[k]);const KS=keysSchool().filter(k=>k!=='arriere').filter(used),KE=[];P.splice(0,P.length,...P.filter(p=>partsK(p,KS)>0));const tot={};[...KS,...KE].forEach(k=>tot[k]=0);let TS=0,T=0;

 const nc=5+(KE.length?KE.length+1:0);
 return `<div class="pg">${pageHeader(ec?S().ecoles[ec]:{nom:'Écoles Être et Avoir en Jésus-Christ (primaire et maternelle)'},S().annee)}<div class="title">Journal des recettes${ec?' — '+(ec==='primaire'?'Primaire':'Maternelle'):''}</div><p>Période : du ${fmtDate(d1)||'début'} au ${fmtDate(d2)||fmtDate(today())} · ${P.length} reçu(s)</p>
 <table class="small"><thead><tr><th>Date</th><th>Reçu</th><th>Élève</th><th>Classe</th><th class="r">Montant</th>${KE.map(k=>`<th class="r">${esc(rubLabel(k))}</th>`).join('')}${KE.length?'<th class="r">Total encaissé</th>':''}</tr></thead><tbody>${rows||`<tr><td colspan="${nc}" class="c">Aucune recette</td></tr>`}</tbody>
 <tfoot><tr><th colspan="4">Total</th><th class="r">${fcfa(TS)}</th>${KE.map(k=>`<th class="r">${fcfa(tot[k])}</th>`).join('')}${KE.length?`<th class="r">${fcfa(T)}</th>`:''}</tr></tfoot></table>
 <p><b>Recettes de l'école : ${fcfa(TS)}</b>${KE.length?` &nbsp;·&nbsp; ${KE.map(k=>esc(rubLabel(k))+' (hors recettes école) : '+fcfa(tot[k])).join(' · ')} &nbsp;·&nbsp; Total encaissé : ${fcfa(T)}`:''}</p>${signBlock().replace("L'enseignant(e)","Le/La Caissier(ère)").replace('<div>Le Parent</div>','')}</div>`;

/* ---------- Fin d'année ---------- */
function vFin(){
 const a=S().annee,n=nextYear(a);
 const blocks=sortedClasses().map(c=>{const L=classInscs(c.id);if(!L.length)return '';const A=c.ecole==='primaire'?annualResults(c.id,a).res:{};
  const rows=L.map(i=>{const e=elv(i.eleveId),r=A[i.id];return `<tr><td><b>${esc(fullName(e))}</b></td>${c.ecole==='primaire'?`${r.tri.map(x=>`<td class="num">${fmtN2(x)}</td>`).join('')}<td class="num"><b>${fmtN2(r.moy)}</b></td><td>${rangTxt(r,e.sexe)}</td>`:'<td colspan="5" class="muted">maternelle — pas de moyenne</td>'}<td class="muted">${esc(proposition(i,r))}</td><td><select onchange="ins('${i.id}').decision=this.value;save()">${opts([['','—'],...DECISIONS],i.decision)}</select></td></tr>`}).join('');
  return `<div class="card" style="padding:0;overflow:auto"><div style="padding:10px 14px"><b>${esc(c.nom)}</b> <span class="muted">· ${L.length} élève(s) · les admis passent en ${esc(NEXT[c.niveau]||'— fin de cycle (sortie)')}</span></div><table class="data"><thead><tr><th>Élève</th><th class="num">T1</th><th class="num">T2</th><th class="num">T3</th><th class="num">Annuelle</th><th>Rang</th><th>Proposition</th><th>Décision</th></tr></thead><tbody>${rows}</tbody></table></div>`}).join('');
 return `<h1>Fin d'année ${esc(a)} → passage en ${esc(n)}</h1>
 <div class="card"><ol class="steps" style="margin-top:0"><li>Vérifiez les décisions. Proposition automatique : moyenne annuelle ≥ ${fmtN(S().seuil)}/10 → Admis(e), sinon Redouble (modifiable dans Paramètres).</li>
 <li>Cliquez sur « Passer à ${esc(n)} » : l'année suivante s'ouvre. Les élèves ne sont pas inscrits automatiquement : ils apparaissent dans « Inscrire un élève » (liste des anciens élèves à réinscrire) avec leur nouvelle classe — classe supérieure pour les admis (GS → CP1, avec un nouveau numéro P), même classe pour les redoublants. On les inscrit d'un clic quand les parents viennent. Les CM2 admis passent au statut « Sorti (fin de cycle) ». Ce qui reste impayé est reporté en arriéré.</li>
 <li>Une sauvegarde de l'année ${esc(a)} est téléchargée automatiquement avant le passage. Les données de ${esc(a)} restent consultables (Paramètres → année scolaire).</li></ol>
 <div class="row"><button onclick="applyPropositions()">Remplir les décisions vides avec les propositions</button><button class="primary" onclick="doPassage()">Passer à l'année ${esc(n)}</button></div></div>${blocks||'<div class="card">Aucune inscription cette année.</div>'}`;
}
function applyPropositions(){
 let k=0;sortedClasses().forEach(c=>{const A=c.ecole==='primaire'?annualResults(c.id).res:{};classInscs(c.id).forEach(i=>{if(!i.decision){const p=proposition(i,A[i.id]);if(p){i.decision=p;k++}}})});
 save();render();toast(`${k} décision(s) remplie(s)`);
}
function doPassage(){
 const a=S().annee,n=nextYear(a),L=yearInscs(a);
 if(!L.length){alert('Aucune inscription cette année.');return}
 const sans=L.filter(i=>!i.decision).length;
 if(!confirm(`Passer de ${a} à ${n} ?${sans?`\n\nAttention : ${sans} élève(s) sans décision : ils seront proposés dans la classe supérieure.`:''}\n\nUne sauvegarde sera d'abord téléchargée.`))return;
 downloadBackup();
 let nb=0,sortis=0;const manque=new Set();
 let arrT=0;
 arrInscs(a).forEach(i=>{const e=elv(i.eleveId),r=reste(i);if(e&&r>0){e.arriereEnAttente=(+e.arriereEnAttente||0)+r;arrT+=r}});
 L.forEach(i=>{const e=elv(i.eleveId),c=cls(i.classeId);if(!e||!c||inscOf(e.id,n))return;const d=i.decision;const r=reste(i);if(r>0){e.arriereEnAttente=(+e.arriereEnAttente||0)+r;arrT+=r}
  if(d==='Admis(e)'){const nx=NEXT[c.niveau];if(!nx){e.statut='Sorti (fin de cycle)';sortis++;return}if(!findClassByNiveau(nx))manque.add(nx);e.niveauPrevu=nx;nb++}
  else if(d==='Redouble'){e.niveauPrevu=c.niveau;nb++}
  else if(d==='Abandon')e.statut='Abandon';else if(d==='Transféré(e)')e.statut='Transféré';else if(d==='Exclu(e)')e.statut='Exclu';
 });
 S().annee=n;save();UI.view='inscrire';render();
 alert(`Année ${n} ouverte.\n${nb} élève(s) à réinscrire, ${sortis} sortie(s) en fin de cycle.\nArriérés reportés : ${fcfa(arrT)} (ajoutés à l'inscription quand l'élève revient).${manque.size?`\nClasses à créer : ${[...manque].join(', ')}.`:''}\n\nÀ la rentrée, ouvrez « Inscrire un élève » : la liste des anciens élèves à réinscrire s'y trouve. Inscrivez chaque élève quand ses parents viennent.`);
}

 return `<h1>Paramètres & données</h1><div class="card"><h2 style="margin-top:0">Photos des élèves</h2><p style="margin-top:0">Les photos sont gardées dans un dossier « photos » sur OneDrive (à côté du fichier de données), une photo par élève, nommée par son numéro (ex. P0185.jpg). Le programme réduit chaque photo (environ 25 Ko). À faire une fois sur chaque ordinateur. On ajoute une photo depuis la fiche de l'élève.</p>${DIR_OK?(PDIR?`<p>Dossier : <b>${esc(PDIR.name)}</b> — ${PDIR_OK?'connecté':'accès à autoriser'}</p><button onclick="photoDirConnect()">${PDIR_OK?'Choisir un autre dossier':'Autoriser / choisir le dossier'}</button> <button onclick="photoDirForget()">Déconnecter</button>`:`<button class="primary" onclick="photoDirConnect()">Connecter le dossier des photos</button>`):'<p class="muted">Non disponible dans ce navigateur (utilisez Chrome ou Edge sur l\'ordinateur).</p>'}</div><div class="card"><h2 style="margin-top:0">Mode essai (pour s'entraîner)</h2><p style="margin-top:0">Pour apprendre à utiliser le programme sans toucher aux vraies données : inscrire un élève, saisir un paiement, imprimer un reçu… Rien n'est enregistré, et les reçus portent la mention « ESSAI ».</p>${TRY?`<button class="primary" onclick="stopEssai()">Terminer l'essai</button>`:`<button class="primary" onclick="startEssai()">Commencer un essai</button>`}</div>

const CSV_COLS=['Matricule','Nom','Prénoms','Sexe','Date de naissance','Lieu de naissance','Classe','Père','Mère','Tuteur','Téléphone','Adresse'];

function parseCSV(text){
 text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0];const cnt=ch=>first.split(ch).length;const d=[';',',','\t'].sort((a,b)=>cnt(b)-cnt(a))[0];
 const rows=[];let row=[],cur='',q=false;
 for(let k=0;k<text.length;k++){const ch=text[k];if(q){if(ch==='"'){if(text[k+1]==='"'){cur+='"';k++}else q=false}else cur+=ch}else{if(ch==='"')q=true;else if(ch===d){row.push(cur);cur=''}else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur=''}else if(ch!=='\r')cur+=ch}}
 if(cur||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()));
}
function toISO(s){s=String(s||'').trim();if(!s)return '';let m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(s);if(m){let y=+m[3];if(y<100)y+=y>50?1900:2000;return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}
 if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);if(/^\d{5}$/.test(s)){const dt=new Date(Date.UTC(1899,11,30)+(+s)*864e5);return dt.toISOString().slice(0,10)}return s}
function importCSV(file){if(!file)return;const r=new FileReader();r.onload=()=>importText(r.result);r.readAsText(file,'utf-8')}
function importPaste(){const t=document.getElementById('p_paste').value;if(!t.trim()){alert("Collez d'abord les cellules copiées depuis Excel (avec la ligne des titres).");return}importText(t);document.getElementById('p_paste')&&(document.getElementById('p_paste').value='')}
function importText(text){{
 const rows=parseCSV(text);if(rows.length<2){alert('Fichier vide ou illisible.');return}
 const H=rows[0].map(h=>norm(h).replace(/[^a-z]/g,''));
 const find=(...keys)=>H.findIndex(h=>keys.some(k=>h===k||h.startsWith(k)));
 const ix={mat:find('matricule','mle'),nom:find('nom'),pre:find('prenom'),sexe:find('sexe','genre'),dn:find('datedenaissance','datenaissance','naissance','nele','neele','datenaiss','dn'),ln:find('lieudenaissance','lieu'),cl:find('classe','niveau'),pere:find('pere'),mere:find('mere'),tut:find('tuteur','parent','contact'),tel:find('telephone','tel','phone','cel'),adr:find('adresse','quartier','domicile')};
 if(ix.nom<0){alert('Colonne « Nom » introuvable dans la première ligne.');return}
 if(ix.pre===ix.nom)ix.pre=-1;
 let added=0,skipped=0,inscrits=0;const unknown=new Set();
 rows.slice(1).forEach(c=>{const g=k=>ix[k]>=0?String(c[ix[k]]??'').trim():'';let nom=g('nom'),pre=g('pre');if(!nom)return;
  if(ix.pre<0&&nom.includes(' ')){const p=nom.split(/\s+/);nom=p.shift();pre=p.join(' ')}
  const sx=norm(g('sexe'));const sexe=/^(f|fille|feminin)/.test(sx)?'F':'M';const dn=toISO(g('dn'));const mat=g('mat');
  if(DB.eleves.some(x=>(mat&&x.matricule===mat)||(norm(x.nom)===norm(nom)&&norm(x.prenoms)===norm(pre)&&(x.dateNaiss||'')===dn))){skipped++;return}
  const e={id:uid(),matricule:mat||'',nom:nom.toUpperCase(),prenoms:pre,sexe,dateNaiss:dn,lieuNaiss:g('ln'),nationalite:'Burkinabè',pere:g('pere'),mere:g('mere'),tuteur:g('tut'),telephone:g('tel'),adresse:g('adr'),dateEntree:'',ecoleOrigine:'',statut:'Actif',boursier:false,observations:''};
  if(!e.matricule){const cv0=norm(g('cl'));const c0=DB.classes.find(x=>norm(x.nom)===cv0||norm(x.niveau)===cv0);e.matricule=nextMatricule(c0?.ecole)}DB.eleves.push(e);added++;
  const cv=norm(g('cl')).replace(/\s+/g,' ');if(cv){const c=DB.classes.find(x=>norm(x.nom)===cv||norm(x.niveau)===cv||norm(x.nom).replace(/\s/g,'')===cv.replace(/\s/g,''));if(c){createInscription(e.id,c.id);inscrits++}else unknown.add(g('cl'))}
 });
 save();render();alert(`Import terminé.\n${added} élève(s) ajouté(s), dont ${inscrits} inscrit(s) en ${S().annee}.\n${skipped} doublon(s) ignoré(s).${unknown.size?`\nClasses non reconnues : ${[...unknown].join(', ')} (élèves ajoutés sans inscription).`:''}`);
}}

let ROLE=null,ROLE_UNTIL=0;const IDLE_MS=15*60*1000;
function secured(){return !!(S().pinAdmin||S().pinStaff)}
function role(){if(!secured())return 'admin';if(ROLE&&ROLE_UNTIL>Date.now())return ROLE;return null}
function isAdmin(){return role()==='admin'}
['click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(ROLE&&ROLE_UNTIL>Date.now())ROLE_UNTIL=Date.now()+IDLE_MS},true));
setInterval(()=>{if(secured()&&ROLE&&ROLE_UNTIL<=Date.now()){ROLE=null;closeModal();closePv();render()}},20000);
async function hashPin(pin){const t=new TextEncoder().encode('eaenjc:'+pin);if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',t);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=0;for(const c of t)h=(h*31+c)|0;return 'x'+h}

const H_ELV={matricule:'Matricule',nom:'Nom',prenoms:'Prénoms',sexe:'Sexe',dateNaiss:'Date de naissance',lieuNaiss:'Lieu de naissance',nationalite:'Nationalité',acte:"N° d'acte de naissance",pere:'Nom du père',mere:'Nom de la mère',tuteur:'Tuteur / contact',telephone:'Téléphone',adresse:'Adresse',dateEntree:"Date d'entrée",ecoleOrigine:"École d'origine",statut:'Statut',boursier:'Boursier',observations:'Observations',arriereEnAttente:'Arriéré à reporter'};
const H_INS={classeId:'Classe',type:'Type',redoublant:'Redoublant(e)',remise:'Réduction scolarité',arriere:'Arriéré',date:"Date d'inscription"};
function hVal(field,v){if(v===undefined||v===null||v==='')return '(vide)';if(field==='classeId')return cls(v)?.nom||'?';if(field==='boursier'||field==='redoublant')return v?'Oui':'Non';if(/date/i.test(field))return fmtDate(v);if(field.startsWith('frais.')||['remise','arriere','arriereEnAttente'].includes(field))return fcfa(v);return String(v)}
function hLabel(type,field){if(field.startsWith('frais.'))return 'Frais : '+rubLabel(field.slice(6));return (type==='eleve'?H_ELV:H_INS)[field]||field}
function hRecord(type,obj,before,eid,iid){
 const same=(a,b)=>String(a??'')===String(b??'');const out=[];
 if(type==='eleve')Object.keys(H_ELV).forEach(k=>{const b=k==='boursier'?!!before[k]:before[k],a=k==='boursier'?!!obj[k]:obj[k];if(!same(b,a))out.push([k,before[k],obj[k]])});
 else{Object.keys(H_INS).forEach(k=>{if(!same(before[k],obj[k]))out.push([k,before[k],obj[k]])});Object.keys(Object.assign({},before.frais||{},obj.frais||{})).forEach(k=>{const b=(before.frais||{})[k]||0,a=(obj.frais||{})[k]||0;if(+b!==+a)out.push(['frais.'+k,b,a])})}
 DB.hist=DB.hist||[];const t=new Date().toISOString(),by=(devName()||'?')+(secured()?' / '+(role()==='admin'?'Direction':'Comptable'):'');
 out.forEach(([f,o,n])=>DB.hist.push({id:uid(),t,by,type,eid,iid:iid||null,f,o:o??'',n:n??''}));

function modal(html,wide){closeModal();const d=document.createElement('div');d.className='modal-bg';d.id='mbg';d.innerHTML=`<div class="modal"${wide?' style="width:min(980px,100%)"':''}>${html}</div>`;document.body.appendChild(d);const f=d.querySelector('input:not([type=hidden]):not([type=checkbox]),select');if(f)f.focus()}
function closeModal(){const m=document.getElementById('mbg');if(m)m.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('pvbg'))closePv();else closeModal()}});

render();initFile();photoInit();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('message',ev=>{if(ev.data!=='eaenjc-update'||document.getElementById('updbar'))return;const d=document.createElement('div');d.id='updbar';d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:99;background:#1f2937;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center';d.innerHTML='Une nouvelle version du programme est disponible. <button class="small primary" onclick="location.reload()">Recharger</button>';document.body.appendChild(d)});let _rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(_rl)return;_rl=true;if(!SYNC.dirty&&!document.getElementById('mbg'))location.reload();else toast('Nouvelle version installée : elle sera utilisée au prochain démarrage.')})}
</script>
